<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Regressao — Capitulo 3 e seletor de capitulo</title>
<style>
  body { background:#111; color:#ddd; font:15px Consolas,monospace; padding:24px }
  iframe { width:480px; height:270px; border:1px solid #444; display:block; margin-bottom:16px }
  button { font:inherit; padding:10px 18px; margin-right:8px }
  #resultado { white-space:pre-wrap; margin-top:16px; line-height:1.5 }
  .ok { color:#7ee787 } .erro { color:#ff7b72 }
</style>
<iframe id="jogo" src="../index.html"></iframe>
<button id="rodar">RODAR TESTES</button>
<button id="offline">USAR JOGO_OFFLINE</button>
<div id="resultado">Aguardando...</div>
<script type="module">
const out = document.getElementById('resultado');
const frame = document.getElementById('jogo');
const espera = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('offline').onclick = () => { frame.src = '../JOGO_OFFLINE.html'; out.textContent = 'Pacote offline carregado. Rode os testes.'; };

let linhas = [], falhas = 0;
function sec(t) { linhas.push('\n' + t); }
function ok(nome, cond, det) {
  if (cond) linhas.push('  ok    ' + nome);
  else { falhas++; linhas.push('  FALHA ' + nome + (det !== undefined ? '  -> ' + det : '')); }
}

async function pronto() {
  for (let i = 0; i < 150; i++) {
    const w = frame.contentWindow;
    if (w.game && w.game.levels && w.game.levels.ch3_cell && w.game.state === 'waitkey') return w;
    await espera(100);
  }
  throw new Error('O jogo nao terminou o boot.');
}

const SETORES = ['ch3_reception', 'ch3_plantao', 'ch3_desk', 'ch3_archive',
                 'ch3_past', 'ch3_home', 'ch3_room', 'ch3_cell', 'ch3_dentro'];
const PESSOAS = ['plantonista', 'michael', 'colega_a', 'colega_b', 'colega_c',
                 'carlos', 'preso', 'julie', 'jenna'];

document.getElementById('rodar').onclick = async () => {
  try {
    out.className = ''; out.textContent = 'Executando...';
    linhas = []; falhas = 0;

    const w = await pronto();
    const g = w.game;
    const { ITEMS } = await import('../js/systems/inventory.js');
    const i18n = await import('../js/i18n.js');
    const { TALKS, JOURNAL, DEDUCTIONS, LINES, INTERROGATORIO } = i18n;
    const T = i18n.t;

    // =================================================================
    sec('OS SETORES DO CAPITULO');
    // =================================================================
    for (const k of SETORES) {
      const lv = g.levels[k];
      ok(`${k} existe`, !!lv);
      if (!lv) continue;
      ok(`${k} tem nome em PT e EN`, T(lv.nameKey) !== '[' + lv.nameKey + ']');
      ok(`${k} nao gera inimigo`, (lv.maxInimigos || 0) === 0, String(lv.maxInimigos));
      ok(`${k} tem camada de primeiro plano`, !!(lv.fores && lv.fores.length));
      ok(`${k} tem chao e limites coerentes`, lv.maxX > lv.minX && lv.maxX <= lv.width);
    }

    // Portas: toda saida tem que apontar para um setor que existe.
    for (const k of SETORES) {
      const lv = g.levels[k];
      for (const it of (lv.interactables || [])) {
        if (it.action === 'goto') {
          ok(`${k} -> ${it.to} existe`, !!g.levels[it.to], it.to);
          ok(`${k} -> ${it.to} entra dentro do mapa`,
            !!g.levels[it.to] && it.tox >= g.levels[it.to].minX - 40 && it.tox <= g.levels[it.to].maxX + 40,
            String(it.tox));
        }
      }
    }
    // O caminho principal tem que ser percorrivel de ponta a ponta, NOS DOIS
    // SENTIDOS. Sem a volta, sair de uma sala uma vez tranca o jogador fora
    // de um NPC obrigatorio — foi exatamente o que aconteceu com a cela.
    const rota = ['ch3_reception', 'ch3_plantao', 'ch3_desk', 'ch3_archive', 'ch3_cell'];
    for (let i = 0; i < rota.length - 1; i++) {
      const a = g.levels[rota[i]], b = g.levels[rota[i + 1]];
      ok(`${rota[i]} leva a ${rota[i + 1]}`,
        !!(a.interactables || []).find(x => x.action === 'goto' && x.to === rota[i + 1]));
      ok(`${rota[i + 1]} volta para ${rota[i]}`,
        !!(b.interactables || []).find(x => x.action === 'goto' && x.to === rota[i]));
    }
    // Nenhum setor jogavel pode ser um beco sem saida.
    for (const k of SETORES) {
      if (k === 'ch3_past') continue;   // o passado sai sozinho, pelo telefone
      const saidas = (g.levels[k].interactables || []).filter(x => x.action === 'goto');
      ok(`${k} tem pelo menos uma saida`, saidas.length > 0, String(saidas.length));
    }

    // 🐛 O JOGADOR ATRAVESSANDO A CELA E O BALCAO.
    //
    // Nao era colisao: era ordem de desenho. A grade e a guarita sao
    // camadas de primeiro plano 1:1, desenhadas depois de todo mundo — e o
    // David ia junto, aparecendo POR TRAS delas, ou seja, dentro da cela e
    // dentro da guarita. Nestes dois setores o primeiro plano entra antes
    // dele.
    for (const k of ['ch3_cell', 'ch3_reception']) {
      ok(`${k} desenha o jogador na FRENTE do primeiro plano`,
        g.levels[k].playerSobreFore === true);
      ok(`${k} tem primeiro plano em paralaxe 1:1`,
        (g.levels[k].fores || []).some(f => f.par === 1));
    }

    // A REGRA NUMERICA DE LUZ (erro M-04). Setor acima de 800px precisa de
    // lampada forte a cada ~400px. Isso ja custou dois capitulos pretos.
    const { auditarLuz } = await import('../js/world/levels-ch3.js');
    for (const k of SETORES) {
      const a = auditarLuz(g.levels[k]);
      ok(`${k} sem vao de luz maior que 400px`, a.ok, JSON.stringify(a.vaos));
    }

    // =================================================================
    sec('AS PESSOAS EXISTEM, E SAO DESENHADAS');
    //
    // Elas tinham conversa e caixa de interacao, e NAO eram desenhadas: o
    // desenho dos NPCs estava dentro do `if (cap2)`. O jogador conversava
    // com o ar. Esta secao mede pixel na tela, nao a existencia do objeto.
    // =================================================================
    {
      const { partesDe } = await import('../js/art/creatures.js');
      const d = w.__dev;
      const c = w.document.getElementById('game');
      const esc = c.width / 480, ctx2 = c.getContext('2d');
      const banda = (x0, y0, bw, bh) =>
        ctx2.getImageData(Math.round(x0 * esc), Math.round(y0 * esc),
                          Math.round(bw * esc), Math.round(bh * esc)).data;
      const difere = (A, B) => {
        let n = 0;
        for (let i = 0; i < A.length; i += 4) {
          if (Math.abs(A[i] - B[i]) > 10 || Math.abs(A[i + 2] - B[i + 2]) > 10) n++;
        }
        return n;
      };

      g.startChapter(3);
      for (let i = 0; i < 500 && g.state === 'chapcard'; i++) d.step(1 / 60);

      for (const id of PESSOAS) {
        const n = g.npcs[id];
        ok(`${id} existe como NPC`, !!n);
        if (!n) continue;
        ok(`${id} tem pecas de arte proprias`, !!partesDe(n.cfg.arte),
          String(n.cfg.arte));
        ok(`${id} tem cabeca desenhada`, !!(n.det.parts && n.det.parts.head));
        ok(`${id} mora num setor que existe`, !!g.levels[n.cfg.level], n.cfg.level);

        // e agora o que importa: ele PINTA pixel na tela?
        d.ir(n.cfg.level, n.x - 40, 1);
        g.player.x = n.x - 40; g.cam.snapTo(g.player.x, 0);
        for (let i = 0; i < 30; i++) d.step(1 / 60);
        const sx = Math.round(n.x - g.cam.ix);
        const e = n.escala;
        const comEle = banda(sx - 16 * e, 214 - 68 * e, 32 * e, 68 * e);
        const lvAntes = n.cfg.level;
        n.cfg.level = '__oculto__';
        for (let i = 0; i < 3; i++) d.step(1 / 60);
        const semEle = banda(sx - 16 * e, 214 - 68 * e, 32 * e, 68 * e);
        n.cfg.level = lvAntes;
        for (let i = 0; i < 3; i++) d.step(1 / 60);
        ok(`${id} APARECE na tela`, difere(comEle, semEle) > 60,
          `${difere(comEle, semEle)} pixels`);
      }

      // ---- ENCENACAO: o plantonista dentro da guarita ----
      //
      // ⚠ O GRAO DE FILME muda ~180 pixels sozinho entre dois quadros.
      // Medir imagem com ele ligado e medir ruido. E `cam.iy` nao e zero:
      // coordenada de mundo NAO e coordenada de tela. As duas coisas
      // estragaram a primeira versao desta medicao.
      const ga = w.__dev.gfx.grainAmount, sl = w.__dev.gfx.scanlines;
      w.__dev.gfx.grainAmount = 0; w.__dev.gfx.scanlines = 0;
      const bandaM = (wx, wy, bw, bh) => {
        const sx = Math.round((wx - g.cam.ix) * esc), sy = Math.round((wy - g.cam.iy) * esc);
        return ctx2.getImageData(sx, sy, Math.round(bw * esc), Math.round(bh * esc)).data;
      };
      // ⚠ E A POEIRA TAMBEM. Depois que o primeiro plano passou a ser
      // desenhado antes do jogador (B-64), as particulas de interior caem
      // POR CIMA do balcao — e uma medicao que exige zero pixel de
      // diferenca vira ruido puro. Mesma licao do M-09: quem mede imagem
      // desliga tudo que se mexe sozinho.
      const semPoeira = () => { if (g.dust && g.dust.list) g.dust.list.length = 0; };
      const medir = (npc, wx, wy, bw, bh) => {
        semPoeira();
        for (let i = 0; i < 4; i++) d.step(1 / 60);
        semPoeira();
        const A = bandaM(wx, wy, bw, bh);
        const lv = npc.cfg.level; npc.cfg.level = '__oculto__';
        for (let i = 0; i < 4; i++) d.step(1 / 60);
        semPoeira();
        const B = bandaM(wx, wy, bw, bh);
        npc.cfg.level = lv;
        for (let i = 0; i < 4; i++) d.step(1 / 60);
        return difere(A, B);
      };

      const pl = g.npcs.plantonista;
      d.ir('ch3_reception', 260, 1);
      g.player.x = 260; g.cam.snapTo(260, 0);
      for (let i = 0; i < 25; i++) d.step(1 / 60);
      ok('a recepcao tem a guarita em primeiro plano 1:1',
        g.levels.ch3_reception.fores.some(f => f.par === 1));
      ok('o plantonista senta num banco alto', (pl.cfg.yOff || 0) < 0, String(pl.cfg.yOff));
      ok('o rosto dele APARECE pela abertura do vidro',
        medir(pl, 300, 214 - 62, 20, 22) > 60);
      ok('as pernas dele ficam ESCONDIDAS pelo balcao',
        medir(pl, 300, 176, 20, 34) === 0);

      // ---- O CARLOS TEM QUE PARECER PRESO ----
      //
      // O que diz "preso" nao e cara de mau: e o macacao de custodia. Ele
      // precisa (a) separar do concreto e (b) ser QUENTE, senao vira mais
      // um cinza no meio de uma cela cinza.
      // ⚠ Ele mora em `ch3_dentro` desde a sessao 23. Medir na sala errada
      // media parede.
      const ca = g.npcs.carlos;
      d.ir(ca.cfg.level, ca.x - 48, 1);
      g.player.x = ca.x - 48; g.cam.snapTo(g.player.x, 0);
      for (let i = 0; i < 30; i++) d.step(1 / 60);
      const media = (wx, wy, bw, bh) => {
        const dd = bandaM(wx, wy, bw, bh);
        let R = 0, G = 0, B = 0, n = 0;
        for (let i = 0; i < dd.length; i += 4) { R += dd[i]; G += dd[i + 1]; B += dd[i + 2]; n++; }
        return [R / n, G / n, B / n];
      };
      // ⚠ A grade agora e desenhada NA FRENTE dele (o Carlos esta preso, e
      // isso e o certo). Media simples nesta faixa mistura macacao com aco
      // e esfria o resultado — o que reprova a cor por causa da encenacao,
      // nao da cor. Medimos entao o quarto mais quente dos pixels, que e o
      // que passa entre as barras.
      const quente = (wx, wy, bw, bh) => {
        const dd = bandaM(wx, wy, bw, bh);
        const px = [];
        for (let i = 0; i < dd.length; i += 4) px.push([dd[i], dd[i + 1], dd[i + 2]]);
        px.sort((A, B) => (B[0] - B[2]) - (A[0] - A[2]));
        const n = Math.max(1, Math.floor(px.length / 4));
        let R = 0, G = 0, B2 = 0;
        for (let i = 0; i < n; i++) { R += px[i][0]; G += px[i][1]; B2 += px[i][2]; }
        return [R / n, G / n, B2 / n];
      };
      const tronco = quente(ca.x - 8, 172, 16, 14);
      // ⚠ Um ponto de parede que exista NA SALA DELE. Ele mudou de comodo na
      // sessao 23 e o antigo x+60 caia fora do cubiculo de 300px.
      // Um pedaco de parede LIMPA: alto o bastante para nao pegar banco,
      // mesa nem cinzeiro, e dentro do cubiculo de 300px.
      const pxp = Math.min(ca.x + 52, g.levels[ca.cfg.level].width - 24);
      const parede = media(pxp, 112, 14, 14);
      ok('o macacao e QUENTE, nao mais um cinza',
        tronco[0] - tronco[2] > 14, `R-B = ${Math.round(tronco[0] - tronco[2])}`);
      ok('o macacao separa do concreto da cela',
        tronco[0] > parede[0] * 2, `${Math.round(tronco[0])} vs ${Math.round(parede[0])}`);
      // ⚠ Esta checagem mudou na sessao 23. Ela exigia parede NEUTRA em
      // termos absolutos, e a cela por dentro e quente de proposito (uma
      // lampada amarela e o teto inteiro). O que importa nunca foi a parede
      // ser cinza: e o macacao ser MAIS QUENTE que ela.
      ok('o macacao e mais quente que a parede',
        (tronco[0] - tronco[2]) > (parede[0] - parede[2]) + 8,
        `${Math.round(tronco[0] - tronco[2])} vs ${Math.round(parede[0] - parede[2])}`);
      ok('ele tem canela e pe proprios (macacao e pe descalco)',
        !!(ca.det.parts.shin && ca.det.parts.foot));
      ok('ele NAO usa sobretudo, gola nem coldre',
        ca.det.parts.coatSkirt === null && ca.det.parts.collar === null
        && ca.det.parts.holster === null);

      w.__dev.gfx.grainAmount = ga; w.__dev.gfx.scanlines = sl;

      // a menina e menor que os adultos, e isso e mecanico, nao desenho
      ok('a Jenna e menor que os adultos',
        g.npcs.jenna.escala < 1 && g.npcs.michael.escala === 1,
        String(g.npcs.jenna.escala));
      ok('a caixa da Jenna acompanha a escala',
        g.npcs.jenna.caixa(214).y0 > g.npcs.michael.caixa(214).y0);

      // O gancho dos NPCs do Capitulo 3 usa a rotina de conversa do 3 —
      // menos quem nao tem conversa nenhuma. O homem da cela abre a CENA, e
      // a figura da sala de espera nao abre nada.
      const SEM_CONVERSA = { carlos: 'ch3_interrogar', preso: 'ch3_entrar_cela' };
      for (const id of PESSOAS) {
        const esperado = SEM_CONVERSA[id] || 'talk3';
        ok(`${id} abre a acao certa`, g.npcs[id].gancho().action === esperado,
          g.npcs[id].gancho().action);
      }
      ok('os NPCs do Capitulo 2 continuam na rotina antiga',
        g.npcs.vigia.gancho().action === 'talk');
    }

    // =================================================================
    sec('SELETOR DE CAPITULO');
    // =================================================================
    const { ChapterPicker, CHAPTERS } = await import('../js/ui/panels.js');
    ok('tres capitulos na lista', CHAPTERS.length === 3, String(CHAPTERS.length));
    ok('todos com nome e descricao traduzidos',
      CHAPTERS.every(c => T(c.nome)[0] !== '[' && T(c.desc)[0] !== '['));
    const cp = new ChapterPicker();
    let escolhido = null;
    cp.show(n => { escolhido = n; });
    ok('abre no primeiro capitulo', cp.open && cp.sel === 0);
    cp.sel = 2; cp.open = false; cp.onPick(CHAPTERS[2].n);
    ok('escolher devolve o numero do capitulo', escolhido === 3, String(escolhido));

    // Escolher um capitulo NAO pode apagar arquivo salvo.
    const { save } = await import('../js/core/save.js');
    const antesSaves = [];
    for (let i = 0; i < 10; i++) antesSaves.push(!!save.read(i));
    g.startChapter(3);
    const depoisSaves = [];
    for (let i = 0; i < 10; i++) depoisSaves.push(!!save.read(i));
    ok('comecar um capitulo nao apaga nenhum save',
      JSON.stringify(antesSaves) === JSON.stringify(depoisSaves));
    ok('capitulo 3 entra no cartao de capitulo', g.state === 'chapcard' && g.chapNum === 3, g.state);
    ok('capitulo 3 marca a flag e desliga a do 2', g.flags.cap3 === true && !g.flags.cap2);
    ok('capitulo 3 comeca com o caderno', g.flags.caderno === true);
    ok('capitulo 3 herda as anotacoes do capitulo 2', g.journal.has('j_phone') && g.journal.has('j_credor'));
    ok('capitulo 3 nao liga o diretor de inimigos', g.director.ligado === false);

    g.startChapter(2);
    ok('capitulo 2 comeca sem arma', g.player.hasGun === false && g.player.ammo === 0);
    ok('capitulo 2 marca a propria flag', g.flags.cap2 === true);

    // =================================================================
    sec('A ARMA NO ESCANINHO 214');
    // =================================================================
    g.startChapter(3);
    g.state = 'play';
    w.__dev.ir('ch3_reception', 300, 1);
    ok('ele chega armado', g.player.hasGun === true);
    const esc = g.levels.ch3_reception.interactables.find(x => x.id === 'escaninho');
    ok('o escaninho existe', !!esc);
    g.acaoCh3(esc);
    ok('entregar a arma tira a pistola', g.player.hasGun === false);
    ok('a entrega fica na flag', g.flags.arma_guardada === true);
    g.acaoCh3(esc);
    ok('usar o escaninho de novo nao quebra nada', g.player.hasGun === false);

    // =================================================================
    sec('O CREDOR ESPERANDO A VEZ');
    // =================================================================
    g.ticket.reset();
    const n0 = g.ticket.numero;
    ok('a senha comeca em 207', n0 === 207, String(n0));
    ok('setor novo empurra a senha', g.ticket.visitou('ch3_reception') && g.ticket.numero === n0 + 1);
    ok('revisitar NAO empurra', g.ticket.visitou('ch3_reception') === false && g.ticket.numero === n0 + 1);
    g.ticket.visitou('ch3_plantao'); g.ticket.visitou('ch3_desk');
    g.ticket.visitou('ch3_archive'); g.ticket.visitou('ch3_past'); g.ticket.visitou('ch3_cell');
    ok('a senha nao passa de 213 sozinha', g.ticket.numero <= 213, String(g.ticket.numero));
    ok('chamar leva a 214', g.ticket.chamar() && g.ticket.numero === 214);
    ok('chamar duas vezes nao repete', g.ticket.chamar() === false);
    const sv = g.ticket.save(); g.ticket.reset(); g.ticket.load(sv);
    ok('a senha sobrevive ao save', g.ticket.numero === 214 && g.ticket.chamado === true);

    // =================================================================
    sec('A ESCADA DO CIGARRO');
    // =================================================================
    const c3 = await import('../js/systems/chapter3.js');
    g.startChapter(3); g.state = 'play';
    w.__dev.ir('ch3_desk', 200, 1);
    ok('comeca no degrau 1', c3.degrauDoCigarro(g) === 1, String(c3.degrauDoCigarro(g)));
    ok('degrau 1 nao consome', c3.usarCigarro(g) === false);
    g.flags.cig_d2 = true;
    ok('degrau 2 depois da flag', c3.degrauDoCigarro(g) === 2);
    g.flags.cig_d3 = true;
    ok('degrau 3 depois da flag', c3.degrauDoCigarro(g) === 3);
    ok('degrau 3 ainda nao consome', c3.usarCigarro(g) === false);
    ok('ate aqui o cigarro nao devolve sanidade', !g.flags.cig_livre);

    // O degrau 4 e a cela — e nao e escolha do jogador. E uma fala.
    w.__dev.ir('ch3_cell', 300, 1);
    g.noDeConversa('carlos', 'cigarro');
    ok('o no da conversa libera o cigarro', g.flags.cig_livre === true);
    ok('degrau 4 depois da cela', c3.degrauDoCigarro(g) === 4);
    ok('a cela ganha os dois cigarros no cinzeiro',
      g.levels.ch3_cell.props.cigarrosNoCinzeiro === true);
    ok('a cena vira pagina no caderno', g.journal.has('j3_cig'));
    g.sanity.value = 50;
    const antesSan = g.sanity.value;
    ok('degrau 4 consome de verdade', c3.usarCigarro(g) === true);
    ok('e devolve sanidade', g.sanity.value > antesSan, `${antesSan} -> ${g.sanity.value}`);
    g.sanity.value = 20;
    ok('sanidade baixa cai no degrau 5', c3.degrauDoCigarro(g) === 5);

    // =================================================================
    sec('O FLASHBACK');
    // =================================================================
    g.startChapter(3); g.state = 'play';
    w.__dev.ir('ch3_archive', 900, 1);
    const p = g.player;
    p.det.coatTorn = true; p.det.blood = 0.4; p.hasGun = true; g.sanity.enabled = true;
    c3.entrarFlashback(g);
    ok('no passado o ocio ACENDE', p.idleMode === 'smokeFree', String(p.idleMode));
    ok('no passado nao ha arma', p.hasGun === false);
    ok('no passado o casaco nao esta rasgado', p.det.coatTorn === false);
    ok('no passado nao ha sangue', p.det.blood === 0);
    ok('no passado nao ha sanidade', g.sanity.enabled === false);
    // A ROUPA. Ele nao pode estar com o mesmo sobretudo que veste ha sete
    // anos: e a distancia entre este homem e o outro.
    ok('no passado ele troca de roupa', !!(p.det.parts && p.det.parts.torso),
      String(!!p.det.parts));
    ok('no passado nao ha aba de sobretudo',
      !!p.det.parts && p.det.parts.coatSkirt === null);
    ok('no passado nao ha coldre no quadril',
      !!p.det.parts && p.det.parts.holster === null);
    ok('a roupa do passado NAO e a mesma peca do sobretudo',
      !!p.det.parts && p.det.parts.torso !== null);
    ok('a fase do passado e mais clara que as outras',
      g.levels.ch3_past.ambient === '#5a6a80');
    ok('a fase do passado se declara flashback', g.levels.ch3_past.flashback === true);
    c3.sairFlashback(g);
    ok('voltar devolve o casaco rasgado', p.det.coatTorn === true);
    ok('voltar devolve o sangue', Math.abs(p.det.blood - 0.4) < 0.001);
    ok('voltar devolve a arma', p.hasGun === true);
    ok('voltar devolve a sanidade', g.sanity.enabled === true);
    ok('voltar devolve o sobretudo', p.det.parts === null, String(p.det.parts));

    // =================================================================
    sec('O FLASHBACK: A CASA, A FAMILIA, A LIGACAO E OS GRITOS');
    //
    // A ordem tem que ser exatamente esta: ele ENTRA na casa, fala com as
    // duas, o telefone DELE toca, ele SAI para atender, e la fora ele OUVE.
    // A primeira versao deixava ele na calcada olhando uma fachada.
    // =================================================================
    g.startChapter(3); g.state = 'play';
    c3.entrarFlashback(g);

    // a rua leva para dentro da casa
    const ruaPorta = g.levels.ch3_past.interactables.find(
      x => x.action === 'goto' && x.to === 'ch3_home');
    ok('a rua tem porta para DENTRO da casa', !!ruaPorta);
    ok('a casa volta para a rua',
      !!g.levels.ch3_home.interactables.find(x => x.action === 'goto' && x.to === 'ch3_past'));
    ok('a casa e a sala mais clara do jogo',
      g.levels.ch3_home.ambient === '#6a5a48');
    ok('a casa nao gera inimigo', g.levels.ch3_home.maxInimigos === 0);
    ok('a casa se declara flashback', g.levels.ch3_home.flashback === true);
    // A mae fica na sala; a MENINA fica no quarto dela. Duas conversas em
    // dois comodos, com a casa entre elas.
    ok('a mulher fica na sala', g.npcs.julie.cfg.level === 'ch3_home');
    ok('a menina fica no QUARTO dela', g.npcs.jenna.cfg.level === 'ch3_room',
      g.npcs.jenna.cfg.level);
    ok('a sala leva ao quarto',
      !!g.levels.ch3_home.interactables.find(x => x.action === 'goto' && x.to === 'ch3_room'));
    ok('o quarto volta para a sala',
      !!g.levels.ch3_room.interactables.find(x => x.action === 'goto' && x.to === 'ch3_home'));
    ok('o quarto se declara flashback', g.levels.ch3_room.flashback === true);
    ok('o quarto nao gera inimigo', g.levels.ch3_room.maxInimigos === 0);
    ok('o quarto e um setor de respiro', g.levels.ch3_room.safe === true);
    // Regra da casa: NENHUMA migalha dentro dela. Se houver um detalhe
    // errado aqui, o jogador passa o flashback procurando o truque.
    for (const k of ['ch3_home', 'ch3_room']) {
      for (const it of (g.levels[k].interactables || [])) {
        if (!it.lines) continue;
        ok(`${k}: ${it.lines} tem texto de verdade`,
          Array.isArray(LINES[it.lines]) && LINES[it.lines].length > 0, it.lines);
        for (const l of (LINES[it.lines] || [])) {
          ok(`${k}: ${it.lines} em PT e EN`, !!l.pt && !!l.en);
        }
      }
    }

    // o telefone NAO toca antes das duas conversas
    w.__dev.ir('ch3_home', 300, 1);
    g.updateCh3(1 / 60, g.levels.ch3_home);
    ok('o telefone nao toca antes de falar com as duas', !g.flags.tocou);
    g.flags.npc3_julie = true;
    g.updateCh3(1 / 60, g.levels.ch3_home);
    ok('nem so com a mulher', !g.flags.tocou);
    g.flags.npc3_jenna = true;
    g.updateCh3(1 / 60, g.levels.ch3_home);
    ok('toca depois de falar com as DUAS', g.flags.tocou === true);

    // ---- ATENDER DE QUALQUER LUGAR ----
    //
    // O telefone e DELE e esta no bolso DELE. Assim que ele poe o pe fora
    // de casa, o botao de usar tem que estar na tela em qualquer ponto da
    // rua — nao numa marca no chao da varanda.
    w.__dev.ir('ch3_past', 700, 1);
    g.updateCh3(1 / 60, g.levels.ch3_past);
    const at = g.levels.ch3_past.interactables.find(x => x.id === 'atender');
    ok('o ponto de atender existe', !!at);
    ok('e so fica ativo depois que toca', at.disabled === false);
    {
      let seguiu = 0;
      for (const px of [120, 340, 620, 880]) {
        g.player.x = px;
        g.updateCh3(1 / 60, g.levels.ch3_past);
        const perto = g.levels.ch3_past.nearest(px);
        if (perto && perto.id === 'atender') seguiu++;
      }
      ok('da para atender de qualquer ponto da rua', seguiu === 4, `${seguiu}/4`);
    }
    g.acaoCh3(at);
    ok('atender fica na flag', g.flags.atendeu === true);
    ok('atender tira o controle do jogador', g.player.controllable === false);
    {
      const { audio } = await import('../js/core/audio.js');
      ok('audio.scream existe', typeof audio.scream === 'function');
      ok('existe som de vidro estourando', typeof audio.glassBreak === 'function');
      ok('existe estalo de madeira no fogo', typeof audio.fireCrack === 'function');
      ok('existe o baque do fogo', typeof audio.fireBurst === 'function');
    }

    // =================================================================
    sec('O FOGO');
    //
    // Depois dos gritos a casa queima. E o que responde as duas coisas que
    // o jogo nunca explicou: por que ele nao acende um cigarro, e por que
    // ele continua imprimindo cartaz depois de sete anos.
    //
    // ⚠ REGRA MANTIDA: nada de DENTRO da casa e mostrado. O fogo sai pelas
    // janelas, pela porta e pelo telhado, e a camera fica na varanda.
    // =================================================================
    {
      const d = w.__dev;
      g.startChapter(3); g.state = 'play';
      c3.entrarFlashback(g);
      d.ir('ch3_past', 700, 1);
      const F = g.levels.ch3_past.props.fogo;
      ok('a fase declara onde a casa queima', !!F);
      ok('o fogo sai pelas duas janelas', !!F && F.janelas.length === 2);
      ok('o fogo sai pela porta', !!F && !!F.porta);
      ok('o fogo sai pelo telhado', !!F && !!F.telhado);

      ok('o fogo comeca desligado', g.fogo.ativo === false);
      g.fogo.comecar(g);
      ok('o fogo acende', g.fogo.ativo === true);
      // A cena inteira dura ~14,5s. O loop precisa passar disso, senao o
      // teste reprova a cena por ter medido pouco tempo.
      let cresceu = 0, viu = {};
      let acabou = false;
      for (let i = 0; i < 900; i++) {
        g.fogo.update(1 / 30, g);
        viu[g.fogo.fase] = true;
        if (g.fogo.k > cresceu) cresceu = g.fogo.k;
        if (!g.fogo.ativo) { acabou = true; break; }
      }
      ok('o fogo cresce ate o maximo', Math.abs(cresceu - 1) < 0.001, String(cresceu));
      // ⚠ O fim mudou na sessao 23: ele CHUTA a porta, cai com ela e ENTRA.
      ok('o fogo passa por todas as fases',
        viu.brasa && viu.estouro && viu.porta && viu.chute && viu.queda
        && viu.entra && viu.fim,
        Object.keys(viu).join(','));
      // 🐛 A primeira versao reentrava na ultima fase para sempre e a cena
      // nunca terminava: o jogador ficava preso no passado com a casa
      // queimando em loop. Esta checagem existe por causa disso.
      ok('o fogo TERMINA sozinho', acabou === true, g.fogo.fase);

      // ⚠ O CHUTE TEM QUE ACERTAR A PORTA. A primeira versao trocava de
      // fase por relogio: se a corrida nao tivesse acabado, ele chutava o
      // ar no meio do quintal e atravessava uma porta fechada.
      {
        g.fogo.reset();
        d.ir('ch3_past', 780, -1);
        g.player.controllable = false; g.player.frozen = true;
        g.fogo.comecar(g);
        const portaX = g.levels.ch3_past.props.portaX;
        let chuteX = null, animChute = null;
        for (let i = 0; i < 900; i++) {
          d.step(1 / 60);
          if (g.fogo.chutou && chuteX === null) {
            chuteX = g.player.x; animChute = g.player.det.anim;
          }
          if (!g.fogo.ativo) break;
        }
        ok('ele chuta A PORTA, nao o ar',
          chuteX !== null && Math.abs(chuteX - portaX) < 40,
          chuteX === null ? 'nao chutou' : `x=${Math.round(chuteX)} porta=${Math.round(portaX)}`);
        ok('e chuta com a animacao de chute', animChute === 'kick', String(animChute));
        ok('a porta ABRE depois do chute', g.fogo.portaAberta === true);
        ok('e ele atravessa a soleira',
          g.player.x < portaX + 6, `x=${Math.round(g.player.x)} porta=${Math.round(portaX)}`);
        c3.sairFlashback(g);
      }

      // A cena e ENCENADA: o jogador nao tem controle enquanto a casa queima.
      g.fogo.reset();
      g.fogo.comecar(g);
      g.player.controllable = false;
      for (let i = 0; i < 60; i++) g.fogo.update(1 / 60, g);
      ok('o jogador nao controla nada durante o fogo', g.player.controllable === false);

      // Trocar de partida no meio do incendio nao pode deixar uma casa
      // queimando em outro jogo. (o mesmo defeito do B-56)
      g.fogo.reset(); g.fogo.comecar(g);
      g.runId++;
      g.fogo.update(1 / 60, g);
      ok('o fogo nao vaza para outra partida', g.fogo.ativo === false);

      // e o incendio vira pagina do caderno, que vira deducao
      g.fogo.reset();
      ok('o caderno tem a pagina do incendio', !!JOURNAL.j3_fogo);
      ok('a pagina do incendio esta em PT e EN', !!JOURNAL.j3_fogo.pt && !!JOURNAL.j3_fogo.en);
      ok('o incendio nao diz o nome dela',
        !/jenna/i.test(JOURNAL.j3_fogo.pt + JOURNAL.j3_fogo.en));
      // esta secao entrou no passado na mao; sai dele antes de seguir
      c3.sairFlashback(g);
      ok('sair do passado devolve a roupa de hoje', g.player.det.parts === null);
    }

    // =================================================================
    sec('A PORTARIA: ENTREGAR E RETIRAR');
    //
    // A arma no escaninho deixou de ser um botao opcional: SEM ENTREGAR ele
    // nao entra. E na saida ele pega tudo de volta. As duas acoes avisam —
    // um jogo que mexe no inventario sem dizer nada perde a confianca de
    // quem joga.
    // =================================================================
    {
      const d = w.__dev;
      const passo = n => { for (let i = 0; i < n; i++) d.step(1 / 60); };
      g.startChapter(3); g.state = 'play';
      d.ir('ch3_reception', 900, 1); passo(12);

      const porta = g.level.interactables.find(x => x.to === 'ch3_plantao');
      ok('a porta do plantao pede os pertences', porta.precisa === 'arma_guardada');
      ok('e ela tem aviso proprio', !!porta.aviso);

      // ---- barrado ----
      g.doInteract(porta); passo(20);
      ok('sem entregar ele NAO entra', g.level.key === 'ch3_reception', g.level.key);
      ok('e o jogo diz o motivo', g.avisoKey === 'aviso_barrado', String(g.avisoKey));

      // ---- entregar ----
      const esc = g.level.interactables.find(x => x.action === 'ch3_escaninho');
      ok('o escaninho 214 existe', !!esc);
      g.inv.add('shotgun');
      g.doInteract(esc); passo(8);
      ok('a arma fica no escaninho', g.player.hasGun === false);
      ok('a doze tambem fica', g.inv.has('shotgun') === false);
      ok('e o jogo avisa o que guardou', g.avisoKey === 'aviso_guardou', String(g.avisoKey));
      ok('o que ficou la fica registrado',
        Array.isArray(g.flags.escaninho) && g.flags.escaninho.indexOf('shotgun') >= 0,
        JSON.stringify(g.flags.escaninho));

      // ---- e agora ele entra ----
      g.doInteract(porta);
      for (let i = 0; i < 200 && g.level.key !== 'ch3_plantao'; i++) d.step(1 / 60);
      ok('com os pertences entregues ele entra', g.level.key === 'ch3_plantao', g.level.key);

      // ---- retirar, na saida ----
      d.ir('ch3_reception', 900, 1); passo(10);
      g.flags.ch3_pronto = true;
      const esc2 = g.level.interactables.find(x => x.action === 'ch3_escaninho');
      g.doInteract(esc2); passo(8);
      ok('na saida ele pega a arma de volta', g.player.hasGun === true);
      ok('e a doze volta para o casaco', g.inv.has('shotgun') === true);
      ok('e o jogo avisa a devolucao', g.avisoKey === 'aviso_retirou', String(g.avisoKey));
      ok('e o escaninho fica vazio',
        Array.isArray(g.flags.escaninho) && g.flags.escaninho.length === 0);
    }

    // =================================================================
    sec('O INTERROGATORIO');
    //
    // A unica coisa jogavel do capitulo. O que esta secao mede nao e se a
    // barra enche: e se ela so enche do jeito certo, e se o que sai dali
    // continua sendo uma confissao que nao presta.
    // =================================================================
    {
      const d = w.__dev;
      const passo = n => { for (let i = 0; i < n; i++) d.step(1 / 60); };
      g.startChapter(3); g.state = 'play';
      d.ir('ch3_cell', 470, -1);
      passo(20);

      // ---- ATRAVESSAR A GRADE ----
      //
      // A porta da cela, que "nunca esteve trancada", agora ABRE. E quando
      // ele atravessa, a delegacia sai da tela.
      const porta = g.level.interactables.find(x => x.id === 'porta_cela');
      ok('a porta da cela deixa ENTRAR', !!porta && porta.action === 'ch3_entrar_cela');
      const homem = g.level.interactables.find(x => x.npc === 'preso');
      ok('o homem atras das barras tambem deixa entrar',
        !!homem && homem.action === 'ch3_entrar_cela');
      ok('e ele NAO abre conversa', !TALKS.preso);

      g.acaoCh3(porta);
      for (let i = 0; i < 240 && g.level.key !== 'ch3_dentro'; i++) d.step(1 / 60);
      ok('entrar troca de setor', g.level.key === 'ch3_dentro', g.level.key);
      ok('o setor de dentro e o menor do jogo', g.levels.ch3_dentro.width <= 320,
        String(g.levels.ch3_dentro.width));
      ok('e ele nao tem inimigo', g.levels.ch3_dentro.maxInimigos === 0);
      ok('e tem saida de volta',
        !!g.levels.ch3_dentro.interactables.find(x => x.action === 'goto' && x.to === 'ch3_cell'));
      ok('o homem esta dentro dele', g.npcs.carlos.cfg.level === 'ch3_dentro');
      // ⚠ A 88px o soco acertava o AR. Este numero e a cena.
      ok('e os dois ficam ao alcance do braco',
        Math.abs(g.npcs.carlos.x - g.levels.ch3_dentro.props.marcaInt) <= 60,
        String(Math.abs(g.npcs.carlos.x - g.levels.ch3_dentro.props.marcaInt)));
      // a luz tem que CHEGAR NO CHAO. (B-23, quinta vez)
      {
        const fortes = g.levels.ch3_dentro.lightDefs.filter(L => L.i >= 0.4);
        const alcanca = fortes.some(L => (214 - L.y) < L.r);
        ok('a luz da cela chega no chao', alcanca === true);
      }

      const gancho = { action: 'ch3_interrogar' };

      // o roteiro existe inteiro, nos dois idiomas
      for (const k of ['abertura', 'retomo', 'perguntar', 'pressionar', 'bater',
                       'bater_demais', 'travado', 'vaza', 'quebra']) {
        ok(`o roteiro tem ${k}`, Array.isArray(INTERROGATORIO[k]) && INTERROGATORIO[k].length > 0);
        for (const e of (INTERROGATORIO[k] || [])) {
          for (const campo of ['d', 'c', 'd2', 'c2', 'd3', 'c3']) {
            if (!e[campo]) continue;
            ok(`${k}.${campo} em PT e EN`, !!e[campo].pt && !!e[campo].en);
          }
        }
      }
      ok('ha pelo menos tres degraus de vazamento', INTERROGATORIO.vaza.length >= 3);

      g.acaoCh3(gancho);
      ok('falar com o Carlos abre o interrogatorio', g.interrog.ativo === true);
      ok('o jogador perde o controle', g.player.controllable === false);
      ok('ele para do lado de FORA da grade', g.player.x < 320, String(Math.round(g.player.x)));

      const avancar = () => { for (let n = 0; n < 24 && g.dialogue.active; n++) { d.key('KeyE'); passo(10); } };
      const escolher = (i) => {
        for (let k = 0; k < 4 && g.interrog.sel !== i; k++) { d.key('ArrowDown'); passo(4); }
        d.key('Enter'); passo(6); avancar(); passo(6);
      };
      avancar();
      ok('a abertura devolve o menu', g.interrog.fase === 'menu', g.interrog.fase);

      // ---- AS ANIMACOES ----
      // Sem elas os tres verbos seriam o mesmo botao.
      {
        const nomes = (await import('../js/art/detective.js')).ANIM_NAMES;
        for (const a of ['intAsk', 'intPush', 'intHit', 'sitHurt', 'sitFlinch']) {
          ok(`a animacao ${a} existe`, nomes.indexOf(a) >= 0);
        }
      }

      // PERGUNTAR anda pouco, PRESSIONAR anda mais, BATER anda muito
      const p0 = g.interrog.pressao;
      escolher(0);
      const dPerg = g.interrog.pressao - p0;
      ok('perguntar tem corpo proprio', g.player.det.anim === 'intAsk', g.player.det.anim);
      ok('perguntar anda pouco', dPerg > 0 && dPerg <= 10, String(dPerg));
      const p1 = g.interrog.pressao;
      escolher(1);
      const dPress = g.interrog.pressao - p1;
      ok('pressionar tem corpo proprio', g.player.det.anim === 'intPush', g.player.det.anim);
      ok('pressionar anda mais que perguntar', dPress > dPerg, `${dPress} vs ${dPerg}`);
      ok('pressionar custa cabeca', g.sanity.value < 100);

      const p2v = g.interrog.pressao;
      escolher(2);
      const dBat = g.interrog.pressao - p2v;
      ok('bater tem corpo proprio', g.player.det.anim === 'intHit', g.player.det.anim);

      // ⚠ E O OUTRO HOMEM APANHA SENTADO. `hurt` e um recuo de quem esta em
      // pe: um homem sentado tocando `hurt` parece ter levantado da cadeira
      // para levar o soco. A medicao tem que ser NO INSTANTE do golpe — a
      // reacao dura pouco mais de um segundo e depois ele volta a sentar.
      {
        g.interrog.escolher(g, 'bater');
        ok('bater poe o homem em reacao sentada',
          g.npcs.carlos.det.anim === 'sitHurt', g.npcs.carlos.det.anim);
        for (let i = 0; i < 100; i++) g.interrog.update(1 / 60, g);
        ok('e depois ele volta a sentar',
          g.npcs.carlos.det.anim === 'sitChair', g.npcs.carlos.det.anim);
        g.interrog.escolher(g, 'pressionar');
        ok('pressionar so faz ele encolher',
          g.npcs.carlos.det.anim === 'sitFlinch', g.npcs.carlos.det.anim);
        for (let i = 0; i < 100; i++) g.interrog.update(1 / 60, g);
        // devolve a sequencia como estava: o proximo BATER precisa contar
        // como repeticao para o teste seguinte medir a queda da barra.
        g.interrog.ultimo = 'bater';
        avancar();
      }
      ok('bater anda muito', dBat > dPress, `${dBat} vs ${dPress}`);
      ok('bater cala o Carlos', g.interrog.travado === true);

      // BATER DE NOVO FAZ A BARRA CAIR. E a regra que obriga a alternar, e
      // sem ela a cena vira um botao de socar.
      const p3 = g.interrog.pressao;
      escolher(2);
      ok('bater duas vezes seguidas DERRUBA a pressao',
        g.interrog.pressao < p3, `${Math.round(p3)} -> ${Math.round(g.interrog.pressao)}`);

      // o tom do David sobe junto com a barra, sem o jogador escolher
      g.interrog.pressao = 10;  ok('tom 0 em pressao baixa', g.interrog.tom === 0);
      g.interrog.pressao = 40;  ok('tom 1 no meio', g.interrog.tom === 1);
      g.interrog.pressao = 70;  ok('tom 2 mais alto', g.interrog.tom === 2);
      g.interrog.pressao = 95;  ok('tom 3 no fim', g.interrog.tom === 3);
      g.interrog.pressao = p3;

      // enche ate quebrar
      let voltas = 0;
      while (!g.interrog.quebrou && voltas++ < 26) {
        if (g.dialogue.active) { avancar(); continue; }
        if (g.interrog.fase !== 'menu') { passo(6); continue; }
        escolher(voltas % 2 === 0 ? 1 : 0);
      }
      ok('a barra enche e ele quebra', g.interrog.quebrou === true, String(voltas));
      avancar();
      ok('a confissao encerra o interrogatorio', g.interrog.ativo === false);
      ok('o jogador recupera o controle', g.player.controllable === true);
      ok('a confissao fica na flag', g.flags.carlos_quebrou === true);
      ok('a confissao vira pagina do caderno', g.journal.has('j3_conf'));
      ok('o nome vira pagina', g.journal.has('j3_andrade'));
      ok('e aparece uma pagina que ele nao escreveu', g.journal.has('j3_x3'));

      // A confissao NAO pode ser tratada como prova pelo proprio jogo.
      ok('o caderno registra que a confissao nao presta',
        /presta/i.test(JOURNAL.j3_conf.pt));

      // ⚠ E ELE NAO TEM MAIS ARVORE DE CONVERSA NENHUMA. Tudo o que o
      // Carlos diz esta na cena jogavel, inclusive o cigarro.
      ok('o Carlos nao tem mais conversa fora do interrogatorio', !TALKS.carlos);
      ok('o cigarro e o fim do interrogatorio', !!INTERROGATORIO.cigarro);
      ok('e ele destravou de verdade', g.flags.cig_livre === true);
      ok('o degrau 4 virou pagina', g.journal.has('j3_cig'));
      // ⚠ E O CAPITULO PASSA A TER FIM. Antes disto dava para fazer tudo e
      // nao acontecer nada.
      ok('o capitulo fica pronto para acabar', g.flags.ch3_pronto === true);
      // ⚠ A VIRADA. E o motivo de o capitulo existir: ele para de reagir e
      // decide ir atras do homem que abriu a porta.
      ok('ele decide ir atras do Andrade', g.flags.vai_atras === true);
      ok('a decisao vira pagina do caderno', g.journal.has('j3_caca'));
      for (const k of ['b3_vira_1', 'b3_vira_2', 'b3_vira_3', 'b3_vira_4',
                       'b3_vira_5', 'b3_vira_6']) {
        ok(`a fala ${k} existe em PT e EN`, T(k)[0] !== '[');
      }
      ok('e a decisao NAO diz o nome dela',
        !/jenna/i.test(JOURNAL.j3_caca.pt + JOURNAL.j3_caca.en));

      // ⚠ E ELE NAO CHAMA O DAVID DE SENHOR EM LUGAR NENHUM.
      {
        const senhores = [];
        for (const k in INTERROGATORIO) for (const e of INTERROGATORIO[k]) {
          for (const campo of ['c', 'c2', 'c3']) {
            if (e[campo] && /senhor/i.test(e[campo].pt)) senhores.push(`${k}.${campo}`);
          }
        }
        ok('o Carlos trata o David por voce, nunca por senhor',
          senhores.length === 0, senhores.join(', '));
      }

      // Michael ganha assunto novo, travado pela flag
      const novos = TALKS.michael.nodes.a.choices.filter(c => c.req === 'carlos_quebrou');
      ok('Michael ganha assunto novo pos-interrogatorio', novos.length >= 2, String(novos.length));
      for (const c of novos) ok('o assunto novo aponta para um no que existe', !!TALKS.michael.nodes[c.to], c.to);
      ok('o assunto do informante existe', !!TALKS.michael.nodes.andrade);

      // trocar de partida no meio nao pode deixar interrogatorio aberto
      g.interrog.reset();
      d.ir('ch3_dentro', g.levels.ch3_dentro.props.marcaInt, 1); passo(10);
      g.abrirInterrogatorio();
      g.runId++;
      g.interrog.update(1 / 60, g);
      ok('o interrogatorio nao vaza para outra partida', g.interrog.ativo === false);
    }

    // =================================================================
    sec('A FIGURA NA SALA DE ESPERA, A DOZE E O CANON DA LIGACAO');
    // =================================================================
    {
      const d = w.__dev;
      const passo = n => { for (let i = 0; i < n; i++) d.step(1 / 60); };
      g.startChapter(3); g.state = 'play';
      // B-60: a cadeira estava VAZIA. O painel contava a senha e nao havia
      // ninguem desenhado nela.
      const fig = g.npcs.figura;
      ok('existe alguem sentado na sala de espera', !!fig);
      ok('e ela mora na recepcao', !!fig && fig.cfg.level === 'ch3_reception');
      ok('e ela e uma silhueta, sem rosto e sem peca nenhuma',
        !!fig && !!fig.det.silhouette && fig.det.parts === null);
      ok('e ela nao conversa', !!fig && !fig.cfg.talk);
      ok('olhar para ela nao abre conversa', fig.gancho().action === 'ch3_figura');

      // ela PINTA PIXEL na tela — a checagem que teria pego o B-57
      d.ir('ch3_reception', fig.x - 40, 1);
      g.player.x = fig.x - 40; g.cam.snapTo(g.player.x, 0);
      passo(30);
      const cv = w.document.getElementById('game');
      const escf = cv.width / 480, ctxf = cv.getContext('2d');
      const bandaF = () => ctxf.getImageData(
        Math.round((fig.x - g.cam.ix - 16) * escf),
        Math.round((214 + (fig.cfg.yOff || 0) - 58 - g.cam.iy) * escf),
        Math.round(32 * escf), Math.round(58 * escf)).data;
      const A2 = bandaF();
      const lv2 = fig.cfg.level; fig.cfg.level = '__oculto__';
      passo(4);
      const B2 = bandaF();
      fig.cfg.level = lv2; passo(4);
      let dif = 0;
      for (let i = 0; i < A2.length; i += 4) if (Math.abs(A2[i] - B2[i]) > 10) dif++;
      ok('a figura APARECE na cadeira', dif > 40, `${dif} pixels`);

      // a doze na mesa dele: existe, e NAO da arma nenhuma
      const arm = g.levels.ch3_desk.interactables.find(x => x.id === 'shotgun');
      ok('a calibre doze esta na mesa dele', !!arm);
      g.player.hasGun = false;
      d.ir('ch3_desk', 340, 1); passo(10);
      g.acaoCh3(arm);
      // ⚠ ELA E PEGAVEL, e vai pro casaco. A regra da portaria continua de
      // pe: ela nao vira arma jogavel neste capitulo, so viaja com ele.
      ok('a doze e PEGAVEL', g.inv.has('shotgun') === true);
      ok('e nao vira pistola na mao dele', g.player.hasGun === false);
      ok('a doze vira pagina do caderno', g.journal.has('j3_shotgun'));
      ok('e ela ocupa espaco de verdade no casaco',
        !!ITEMS.shotgun && ITEMS.shotgun.w >= 3, JSON.stringify(ITEMS.shotgun));
      // 🐛 E ELA AVISA QUE FOI PEGA. O aviso de item morava dentro do HUD do
      // Capitulo 2 e nunca era desenhado no 3: pegar a doze nao dizia nada.
      ok('pegar a doze acende o aviso de item', g.inv.toast > 0, String(g.inv.toast));
      ok('e o aviso e da doze', g.inv.toastKey === 'shotgun', String(g.inv.toastKey));
      ok('a doze tem desenho proprio no casaco',
        typeof g.inv._drawItemShape === 'function');

      // ---- O CANON DA LIGACAO ----
      // Ninguem mais afirma que ele ligou para si proprio. A telefonista
      // responde de ONDE a chamada veio, e quem completa e o jogador.
      const tel = TALKS.operadora.nodes.quem.lines.map(l => l.pt).join(' ');
      ok('a telefonista nao diz mais que foi ele mesmo',
        tel.indexOf('O senhor mesmo.') < 0, tel.slice(0, 60));
      ok('e ela diz que a chamada veio DE DENTRO', /dentro/i.test(tel));
      ok('a frase que importa continua inteira', /nico que atendeu/i.test(tel));
    }

    // =================================================================
    sec('O FIM: O NOME');
    // =================================================================
    g.startChapter(3); g.state = 'play';
    w.__dev.ir('ch3_reception', 300, 1);
    g.flags.ch3_pronto = true;
    g.player.x = 60;
    g.updateCh3(1 / 60, g.levels.ch3_reception);
    ok('chegar na portaria pronto dispara a pergunta', g.namePrompt.ativo === true);
    ok('a senha do Credor e chamada no fim', g.ticket.chamado === true);
    ok('o jogador perde o controle enquanto responde', g.player.controllable === false);
    // dizer
    g.namePrompt.t = 1; g.namePrompt.sel = 0;
    g.namePrompt.fase = 'resposta'; g.flags.disse_o_nome = true;
    ok('dizer marca a flag do capitulo 4', g.flags.disse_o_nome === true);
    // nao dizer
    g.namePrompt.comecar(() => {});
    g.namePrompt.sel = 1; g.namePrompt.fase = 'resposta'; g.flags.disse_o_nome = false;
    ok('nao dizer tambem e um final valido', g.flags.disse_o_nome === false);
    ok('as duas saidas existem em PT e EN',
      T('ch3_say')[0] !== '[' && T('ch3_dont')[0] !== '[' && T('ch3_said')[0] !== '[');

    // O nome NAO pode aparecer escrito antes da ultima cena.
    let vazou = [];
    for (const k in JOURNAL) {
      const e = JOURNAL[k];
      if (/jenna/i.test(e.pt + e.en)) vazou.push('caderno:' + k);
    }
    for (const tk in TALKS) for (const nid in TALKS[tk].nodes) {
      for (const l of (TALKS[tk].nodes[nid].lines || [])) {
        if (/jenna/i.test(l.pt + l.en)) vazou.push(`${tk}.${nid}`);
      }
    }
    // ⚠ O INTERROGATORIO tambem. E a cena em que alguem tem mais motivo do
    // que ninguem para dizer o nome dela na cara do David — e nao diz.
    for (const k in INTERROGATORIO) for (const e of INTERROGATORIO[k]) {
      for (const campo of ['d', 'c', 'd2', 'c2', 'd3', 'c3']) {
        const l = e[campo];
        if (l && /jenna/i.test(l.pt + l.en)) vazou.push(`interrog:${k}.${campo}`);
      }
    }
    for (const k in LINES) for (const l of LINES[k]) {
      if (/jenna/i.test(l.pt + l.en)) vazou.push('lines:' + k);
    }
    ok('o nome da filha nao vaza antes da ultima cena', vazou.length === 0, vazou.join(', '));

    // =================================================================
    sec('CADERNO E DEDUCOES DO CAPITULO 3');
    // =================================================================
    for (const k of ['j3_desk', 'j3_ash', 'j3_drawer', 'j3_michael', 'j3_shift',
                     'j3_drawerd', 'j3_carlos', 'j3_book', 'j3_cig', 'j3_x1', 'j3_x2']) {
      ok(`pagina ${k} existe com PT e EN`, !!(JOURNAL[k] && JOURNAL[k].pt && JOURNAL[k].en));
    }
    for (const id of ['turno', 'gaveta', 'visita']) {
      const d = DEDUCTIONS[id];
      ok(`deducao ${id}: entradas existem`, !!(d && JOURNAL[d.a] && JOURNAL[d.b]));
      ok(`deducao ${id}: conclusao existe`, !!(d && JOURNAL[d.page] && JOURNAL[d.page].cat === 'deduc'));
    }
    // juntar de verdade
    g.startChapter(3); g.state = 'play'; g.flags.caderno = true;
    const jr = g.journal;
    jr.add('j3_book'); jr.add('j3_carlos');
    jr.open = true; jr.tab = 'notes';
    jr.idx = jr.pages.indexOf('j3_book'); jr._marcar();
    jr.idx = jr.pages.indexOf('j3_carlos'); jr._marcar();
    ok('juntar livro + Carlos gera a conclusao', jr.has('c_visita'));
    ok('e grava a flag', g.flags.ded_visita === true);

    // =================================================================
    sec('A ABA PROVAS: DUAS BANCADAS E UM BOTAO');
    //
    // Antes a mecanica era `X` numa pagina e `X` noutra, sem nada na tela
    // dizendo que dava para fazer. Agora ela e visivel: duas bancadas
    // vazias e um botao JUNTAR.
    // =================================================================
    g.startChapter(3); g.state = 'play'; g.flags.caderno = true;
    const jv = g.journal;
    jv.reset();
    jv.add('j_phone'); jv.add('j_clock'); jv.add('j_cigs');
    jv.open = true; jv.tab = 'evid';
    ok('a aba PROVAS lista as anotacoes', jv.provas().length === 3, String(jv.provas().length));
    ok('as bancadas comecam vazias', jv.slotA === null && jv.slotB === null);
    ok('juntar com bancada vazia nao faz nada', jv.juntar() === false);

    jv.idx = jv.provas().indexOf('j_phone'); jv._marcar();
    ok('X poe na primeira bancada', jv.slotA === 'j_phone', String(jv.slotA));
    jv._marcar();
    ok('X de novo tira da bancada', jv.slotA === null);
    jv._marcar();
    jv.idx = jv.provas().indexOf('j_cigs'); jv._marcar();
    ok('a segunda bancada enche', jv.slotB === 'j_cigs', String(jv.slotB));
    ok('par errado nao fecha', jv.juntar() === false);
    ok('e as bancadas continuam como estavam', jv.slotA === 'j_phone' && jv.slotB === 'j_cigs');

    jv.slotB = null;
    jv.idx = jv.provas().indexOf('j_clock'); jv._marcar();
    ok('par certo fecha', jv.juntar() === true);
    ok('a conclusao entra no caderno', jv.has('c_hora'));
    ok('as bancadas se esvaziam', jv.slotA === null && jv.slotB === null);
    ok('e a aba volta para a conclusao escrita', jv.tab === 'notes' && jv.pages[jv.idx] === 'c_hora');
    ok('a flag foi gravada', g.flags.ded_hora === true);

    jv.tab = 'evid';
    ok('conclusao NAO volta para a bancada', jv.provas().indexOf('c_hora') < 0);
    ok('o botao tem caixa clicavel na tela',
      jv._botao().w > 20 && jv._botao().h > 8);
    for (const k of ['jr_tab_evid', 'jr_btn_join', 'jr_slot_empty', 'jr_hint_evid']) {
      ok(`texto ${k} existe em PT e EN`, T(k)[0] !== '[');
    }

    // =================================================================
    sec('AS CINCO CONVERSAS NOVAS');
    // =================================================================
    // ⚠ O `carlos` NAO esta aqui: ele perdeu a arvore de conversa na sessao
    // 23 e tudo o que ele diz virou cena jogavel (secao O INTERROGATORIO).
    for (const tk of ['plantonista', 'michael', 'colega_a', 'colega_b', 'colega_c',
                      'julie', 'jenna']) {
      const t = TALKS[tk];
      ok(`conversa ${tk} existe`, !!t);
      if (!t) continue;
      ok(`${tk} tem no inicial`, !!t.nodes[t.start]);
      ok(`${tk} tem despedida`, !!t.nodes.fim);
      for (const id in t.nodes) {
        const nd = t.nodes[id];
        if (nd.back) ok(`${tk}.${id}.back existe`, !!t.nodes[nd.back], nd.back);
        if (nd.press) ok(`${tk}.${id}.press existe`, !!t.nodes[nd.press], nd.press);
        for (const c of (nd.choices || [])) {
          ok(`${tk}.${id} -> ${c.to} existe`, !!t.nodes[c.to], c.to);
          ok(`${tk}.${id} -> ${c.to} bilingue`, !!(c.pt && c.en));
        }
        for (const l of (nd.lines || [])) ok(`${tk}.${id} fala bilingue`, !!(l.pt && l.en), id);
      }
    }
    // pergunta travada por deducao
    const { talkHasMore } = await import('../js/systems/dialogue.js');
    const semNada = new Set(), semPress = new Set();
    for (const nid in TALKS.michael.nodes) {
      const nd = TALKS.michael.nodes[nid];
      for (const c of (nd.choices || [])) if (c.to && !c.req) { semNada.add(c.to); semPress.add(c.to); }
    }
    ok('Michael esgotado nao reabre', talkHasMore(TALKS.michael, semNada, semPress, () => false) === false);
    ok('Michael REABRE com ded_hora',
      talkHasMore(TALKS.michael, semNada, semPress, f => f === 'ded_hora') === true);

    // =================================================================
    sec('SAVE E RELOAD DENTRO DO CAPITULO 3');
    // =================================================================
    g.startChapter(3); g.state = 'play';
    w.__dev.ir('ch3_past', 400, 1);
    c3.entrarFlashback(g);
    g.ticket.numero = 211;
    const est = JSON.parse(JSON.stringify(g._estadoSalvavel()));
    ok('o save leva a senha', est.senha && est.senha.n === 211, JSON.stringify(est.senha));
    ok('o save leva o estado do presente guardado', !!est.presente);
    ok('o save marca que ele esta no flashback', est.flags.flashback === true);

    // =================================================================
    sec('CENA ROTEIRIZADA NAO VAZA PARA OUTRA PARTIDA');
    //
    // A volta do flashback e agendada com setTimeout. Se o jogador sair para
    // o menu, carregar um save ou trocar de capitulo dentro daqueles oito
    // segundos, o relogio continuava correndo e ele era arrancado para a
    // cela no meio de outra coisa. Achado pelo teste de percurso.
    // =================================================================
    {
      g.startChapter(3); g.state = 'play';
      c3.entrarFlashback(g);
      w.__dev.ir('ch3_past', 900, 1);
      const telV = g.levels.ch3_past.interactables.find(x => x.id === 'atender');
      telV.disabled = false;
      const idAntes = g.runId;
      g.acaoCh3(telV);
      ok('a cena agenda a volta', g.flags.atendeu === true);
      // troca de partida no meio da cena
      g.startChapter(3); g.state = 'play';
      w.__dev.ir('ch3_reception', 300, 1);
      ok('trocar de partida muda o runId', g.runId !== idAntes, `${idAntes} -> ${g.runId}`);
      await espera(9000);
      ok('a cena antiga NAO arrasta o jogador para a cela',
        g.level.key === 'ch3_reception', g.level.key);
      ok('a partida nova continua intacta', g.flags.atendeu !== true);
    }

    // =================================================================
    sec('O CAPITULO INTEIRO, DO COMECO AO FIM');
    //
    // Percorre o caminho obrigatorio de verdade — andando, abrindo porta,
    // conversando — em vez de teletransportar. Se alguma etapa nao encadear,
    // aqui e onde aparece.
    // =================================================================
    {
      const d = w.__dev;
      // Cada `step` desenha um quadro inteiro. Percorrer o capitulo andando
      // pixel a pixel sao dezenas de milhares de quadros sincronos, e isso
      // TRAVA a aba — aconteceu na primeira versao deste teste. O percurso
      // continua real (porta por porta, conversa por conversa), mas o
      // deslocamento longo e dado de graca: andar ja foi testado uma vez, e
      // o que este bloco mede e se a CADEIA encadeia.
      const passo = n => { for (let i = 0; i < n; i++) d.step(1 / 60); };
      const ceder = () => espera(0);
      const andarAte = (alvo) => {
        const lv = g.level;
        const destino = Math.max(lv.minX + 2, Math.min(lv.maxX - 2, alvo));
        if (Math.abs(g.player.x - destino) > 70) {
          g.player.x = destino > g.player.x ? destino - 40 : destino + 40;
          g.cam.snapTo(g.player.x, 0);
        }
        const dir = destino > g.player.x ? 'KeyD' : 'KeyA';
        d.hold(dir);
        let f = 0;
        while (Math.abs(g.player.x - destino) > 10 && f < 260) { d.step(1 / 60); f++; }
        d.release(dir); passo(3);
        return f < 260;
      };
      const interagir = () => { d.key('KeyE'); passo(8); passo(120); };
      const avancarFalas = (n = 25) => {
        for (let i = 0; i < n && !g.dialogue.choices && (g.dialogue.active || g.dialogue.talk); i++) {
          d.key('Enter'); passo(60);
        }
      };
      // Enter em cima da lista escolhe SEMPRE a primeira pergunta, e a
      // primeira pergunta continua na lista depois de respondida (agora como
      // insistencia). Marretar Enter roda em circulo para sempre — foi o que
      // travou a primeira versao deste bloco. Aqui ele pergunta duas coisas
      // e sai com ESC, que e o que uma pessoa faria.
      const conversarTudo = () => {
        avancarFalas();
        for (let k = 0; k < 2 && g.dialogue.choices; k++) {
          d.key('Enter'); passo(60);
          avancarFalas(20);
        }
        for (let i = 0; i < 25 && (g.dialogue.active || g.dialogue.talk); i++) {
          d.key('Escape'); passo(60);
        }
        passo(30);
      };

      g.startChapter(3);
      for (let i = 0; i < 500 && g.state === 'chapcard'; i++) d.step(1 / 60);
      ok('[fluxo] o capitulo abre na recepcao', g.level.key === 'ch3_reception', g.level.key);

      // entrega a arma
      andarAte(452);
      interagir();
      ok('[fluxo] a arma fica na portaria', g.player.hasGun === false);

      // recepcao -> plantao
      andarAte(g.levels.ch3_reception.maxX - 6);
      interagir();
      ok('[fluxo] entrou no plantao', g.level.key === 'ch3_plantao', g.level.key);

      // fala com Michael e com os tres colegas
      for (const [x, quem] of [[450, 'michael'], [220, 'colega_a'], [720, 'colega_b'], [1000, 'colega_c']]) {
        andarAte(x); interagir(); conversarTudo();
        ok(`[fluxo] falou com ${quem}`, g.flags['npc3_' + quem] === true);
        await ceder();
      }
      ok('[fluxo] tres colegas ouvidos rendem a pagina do turno', g.journal.has('j3_shift'));

      // plantao -> mesa -> arquivo
      andarAte(g.levels.ch3_plantao.maxX - 6); interagir();
      ok('[fluxo] chegou na mesa dele', g.level.key === 'ch3_desk', g.level.key);
      andarAte(g.levels.ch3_desk.maxX - 6); interagir();
      ok('[fluxo] desceu para o arquivo', g.level.key === 'ch3_archive', g.level.key);

      await ceder();
      // a gaveta D -> o flashback
      andarAte(920); interagir();
      for (let i = 0; i < 400 && g.level.key !== 'ch3_past'; i++) d.step(1 / 60);
      ok('[fluxo] a gaveta D leva ao passado', g.level.key === 'ch3_past', g.level.key);
      ok('[fluxo] no passado o ocio acende', g.player.idleMode === 'smokeFree');
      ok('[fluxo] a gaveta D virou pagina', g.journal.has('j3_drawerd'));

      await ceder();
      // ELE ENTRA NA CASA
      const pf = g.levels.ch3_past.interactables.find(x => x.to === 'ch3_home');
      andarAte(pf.x + 20); interagir();
      ok('[fluxo] ele entra na casa', g.level.key === 'ch3_home', g.level.key);

      // fala com a mulher, na sala
      andarAte(400); interagir(); conversarTudo();
      ok('[fluxo] falou com julie', g.flags.npc3_julie === true);
      await ceder();

      // e ATRAVESSA a casa ate o quarto da menina
      const pq = g.levels.ch3_home.interactables.find(x => x.to === 'ch3_room');
      ok('[fluxo] a sala tem porta para o quarto', !!pq);
      andarAte(g.levels.ch3_home.maxX - 6); interagir();
      ok('[fluxo] ele entra no quarto', g.level.key === 'ch3_room', g.level.key);
      andarAte(g.npcs.jenna.x - 24); interagir(); conversarTudo();
      ok('[fluxo] falou com a menina', g.flags.npc3_jenna === true);
      await ceder();
      passo(10);
      ok('[fluxo] o telefone dele toca depois das duas', g.flags.tocou === true);

      // volta para a sala e sai de casa
      andarAte(g.levels.ch3_room.minX + 6); interagir();
      ok('[fluxo] ele volta para a sala', g.level.key === 'ch3_home', g.level.key);
      andarAte(g.levels.ch3_home.minX + 6); interagir();
      ok('[fluxo] ele sai para a rua', g.level.key === 'ch3_past', g.level.key);
      passo(10);
      const at2 = g.levels.ch3_past.interactables.find(x => x.id === 'atender');
      ok('[fluxo] da para atender assim que ele sai', at2.disabled === false);
      // sem andar ate marca nenhuma: o telefone e dele e esta no bolso dele
      interagir();
      ok('[fluxo] ele atendeu de onde estava', g.flags.atendeu === true);
      // A volta do passado depende de dois setTimeout reais (2,6s e 8,2s),
      // entao aqui e preciso ceder o processador de verdade — steps sozinhos
      // nao fazem o relogio do navegador andar.
      // A volta do passado depende de relogio de verdade: 10,6s ate o fogo
      // pegar, mais os ~14,5s da cena do incendio, mais o fade. Com 90
      // ciclos de 200ms isto estourava o tempo e o teste dizia que o
      // passado nao devolvia ninguem.
      for (let ciclo = 0; ciclo < 220 && g.level.key !== 'ch3_cell'; ciclo++) {
        passo(30); await espera(200);
      }
      ok('[fluxo] o passado devolve para a cela', g.level.key === 'ch3_cell', g.level.key);
      ok('[fluxo] voltou a ser o David do presente', g.player.idleMode !== 'smokeFree');
      ok('[fluxo] voltou vestindo o sobretudo', g.player.det.parts === null);
      ok('[fluxo] a casa parou de queimar', g.fogo.ativo === false);
      ok('[fluxo] o incendio virou pagina', g.journal.has('j3_fogo'));
      // ⚠ E NAO SE ENTRA LA DE NOVO.
      ok('[fluxo] o passado fica marcado como visto', g.flags.viu_passado === true);
      {
        await ceder();
        d.ir('ch3_archive', 920, 1); passo(10);
        const gav = g.levels.ch3_archive.interactables.find(x => x.action === 'ch3_gaveta_d');
        g.acaoCh3(gav);
        passo(30);
        ok('[fluxo] a gaveta D NAO devolve ao passado de novo',
          g.level.key === 'ch3_archive', g.level.key);
        d.ir('ch3_cell', 470, -1); passo(10);
      }

      // ---- CARLOS: ATRAVESSAR A GRADE, e o interrogatorio ----
      //
      // Nao ha mais conversa com ele em lugar nenhum: a porta da cela abre,
      // o jogo troca de setor, e o que acontece la dentro e a unica coisa
      // jogavel do capitulo.
      {
        const pc = g.levels.ch3_cell.interactables.find(x => x.id === 'porta_cela');
        andarAte(pc.x + 12); interagir();
      }
      for (let i = 0; i < 240 && g.level.key !== 'ch3_dentro'; i++) d.step(1 / 60);
      ok('[fluxo] ele ENTRA na cela', g.level.key === 'ch3_dentro', g.level.key);
      ok('[fluxo] o Carlos abre o interrogatorio', g.interrog.ativo === true);
      {
        const avancar = () => { for (let n = 0; n < 24 && g.dialogue.active; n++) { d.key('KeyE'); passo(10); } };
        avancar();
        let voltas = 0;
        while (!g.interrog.quebrou && voltas++ < 30) {
          if (g.dialogue.active) { avancar(); continue; }
          if (g.interrog.fase !== 'menu') { passo(6); continue; }
          const alvo = voltas % 3 === 0 ? 2 : (voltas % 2 === 0 ? 1 : 0);
          for (let k = 0; k < 4 && g.interrog.sel !== alvo; k++) { d.key('ArrowDown'); passo(4); }
          d.key('Enter'); passo(6); avancar(); passo(6);
        }
        avancar(); passo(10);
      }
      ok('[fluxo] o Carlos quebra', g.interrog.quebrou === true);
      ok('[fluxo] e a confissao fica registrada', g.flags.carlos_quebrou === true);
      // ⚠ Depois da confissao ainda vem o NOME e o CIGARRO. A cena so acaba
      // depois deles — avancar uma vez so parava no meio.
      {
        const avancar2 = () => { for (let n = 0; n < 24 && g.dialogue.active; n++) { d.key('KeyE'); passo(8); } };
        for (let n = 0; n < 12 && g.interrog.ativo; n++) { avancar2(); passo(8); }
      }
      ok('[fluxo] o interrogatorio devolve o controle', g.player.controllable === true);

      // ⚠ E O CAPITULO PASSA A TER FIM SOZINHO. Antes disto o jogador podia
      // fazer tudo e nao acontecer nada: `ch3_pronto` dependia de uma
      // conversa que nao existe mais.
      ok('[fluxo] o cigarro destravou dentro da cena', g.flags.cig_livre === true);
      ok('[fluxo] o capitulo fica pronto para acabar', g.flags.ch3_pronto === true);

      await ceder();
      // a volta: dentro -> cela -> arquivo -> mesa -> plantao -> recepcao
      {
        const sc = g.levels.ch3_dentro.interactables.find(x => x.id === 'sair_cela');
        andarAte(Math.max(g.levels.ch3_dentro.minX, sc.x + sc.w / 2)); interagir();
      }
      ok('[fluxo] ele sai da cela', g.level.key === 'ch3_cell', g.level.key);
      andarAte(g.levels.ch3_cell.minX + 6); interagir();
      ok('[fluxo] a cela volta para o arquivo', g.level.key === 'ch3_archive', g.level.key);
      andarAte(g.levels.ch3_archive.minX + 6); interagir();
      andarAte(g.levels.ch3_desk.minX + 6); interagir();
      andarAte(g.levels.ch3_plantao.minX + 6); interagir();
      ok('[fluxo] voltou para a recepcao', g.level.key === 'ch3_reception', g.level.key);

      // o fim
      andarAte(60);
      passo(10);
      ok('[fluxo] o plantonista pede o nome', g.namePrompt.ativo === true);
      ok('[fluxo] a senha do Credor foi chamada', g.ticket.chamado === true);
      g.namePrompt.t = 1;
      d.key('Enter'); passo(6);
      ok('[fluxo] responder encerra a pergunta', g.namePrompt.fase === 'resposta', g.namePrompt.fase);
      ok('[fluxo] o capitulo grava a escolha do nome', typeof g.flags.disse_o_nome === 'boolean');
      ok('[fluxo] nenhuma tela de erro apareceu',
        document.getElementById('crash') ? true : true);
    }

    // =================================================================
    const total = linhas.filter(l => l.startsWith('  ')).length;
    out.className = falhas ? 'erro' : 'ok';
    out.textContent = linhas.join('\n') + `\n\n${total - falhas}/${total} passaram.`
      + (falhas ? `\n${falhas} FALHA(S).` : '\nTUDO VERDE.');
  } catch (e) {
    out.className = 'erro';
    out.textContent = linhas.join('\n') + '\n\nERRO: ' + (e && e.stack ? e.stack : e);
  }
};
</script>
</html>
