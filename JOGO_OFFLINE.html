function buildRoad() {
  const TILE = 480;
  const WALK_Y = 214;   // calcada — mesmo chao das outras fases
  const CURB_Y = 222;   // onde comeca o asfalto
  const ROAD_Y = 252;   // onde as rodas encostam (bem a frente da calcada)

  const sky = makeBuffer(VW, VH);
  ditherV(sky.x, 0, 0, VW, VH, '#0b1018', '#1a2130', 8);
  {
    const rnd = mulberry32(7001);
    for (let i = 0; i < 40; i++) {
      sky.x.globalAlpha = 0.10 + rnd() * 0.2;
      rect(sky.x, rnd() * VW, rnd() * 90, 1, 1, '#b8cbe8');
    }
    sky.x.globalAlpha = 1;
  }

  const far = makeBuffer(TILE, VH);
  {
    const rnd = mulberry32(7101);
    let x = -20;
    while (x < TILE + 20) {
      const w = 30 + rnd() * 50, h = 50 + rnd() * 70;
      M.buildingSilhouette(far.x, x, 168, w, h, '#0f1621', 7200 + x, true);
      x += w + 2;
    }
  }

  const mid = makeBuffer(TILE, VH);
  {
    const rnd = mulberry32(7301);
    let x = -30;
    while (x < TILE + 30) {
      const w = 46 + rnd() * 56, h = 90 + rnd() * 60;
      M.buildingSilhouette(mid.x, x, 196, w, h, '#131b26', 7400 + x, true);
      x += w + 1;
    }
  }

  const near = makeBuffer(TILE, VH);
  {
    const n = near.x;
    const rnd = mulberry32(7501);
    let x = -40;
    while (x < TILE + 40) {
      const w = 60 + rnd() * 70, h = 96 + rnd() * 46;
      const y = WALK_Y - h;
      rect(n, x, y, w, h, '#232c38');
      M.brickWall(n, x, y, w, h, 7600 + x, { base: '#2e3844', hi: '#3a4655', dk: '#232a34', mortar: '#1a212a', moss: false });
      rect(n, x, y, w, 2, '#414f60');
      // janelas dos andares de cima
      for (let wy = y + 10; wy < 160; wy += 22) {
        for (let wx = x + 9; wx < x + w - 14; wx += 20) {
          const r = rnd();
          rect(n, wx, wy, 12, 15, r > 0.86 ? '#6a5228' : r > 0.78 ? '#2b3b52' : '#0e131a');

// Lampada de emergencia: a luz que sobrou num predio sem energia. Poucas,
// fracas, e sempre longe uma da outra.
function emergencyLamp(g, x, y) {
  rect(g, x, y, 14, 7, '#2a3038');
  rect(g, x, y, 14, 1, '#3d454f');
  rect(g, x + 2, y + 7, 4, 3, '#8a2e22');
  rect(g, x + 8, y + 7, 4, 3, '#8a2e22');
  rect(g, x + 6, y - 4, 2, 4, '#20252b');
}

function buildCorridor() {
  const W = 1700;

  const back = makeBuffer(Math.ceil(VW + (W - VW) * 0.45) + 8, VH);

  const main = makeBuffer(W, VH);

  const inter = [];

  const volta = M.doorFrame(g, 48, GY, 5111);
  inter.push({
    x: volta.x, y: volta.y, w: volta.w, h: volta.h, prompt: 'prompt_open',
    action: 'goto', to: 'warehouse', tox: 470, tofacing: -1, range: 30, isDoor: true,
  });
  rect(g, 42, GY, 38, 3, '#2b2620');

  // Estantes ate o teto dos dois lados. Sao elas que dizem "isso e um
  // quarteirao" sem ninguem precisar falar.
  rack(g, 150, 40, 120, GY - 40, 5121);
  rack(g, 290, 40, 120, GY - 40, 5131);
  rack(g, 1380, 46, 110, GY - 46, 5141);
  rack(g, 1500, 46, 110, GY - 46, 5151);

  forklift(g, 430, GY, 5161);
  inter.push({ x: 430, y: GY - 46, w: 60, h: 46, prompt: 'prompt_look', lines: 'c2_forklift', range: 34 });

  // pilha de paletes — e daqui que sai o porrete
  for (let i = 0; i < 7; i++) {
    const py = GY - 6 - i * 7;
    rect(g, 560, py, 62, 5, '#4a3524');
    rect(g, 560, py, 62, 1, '#63482f');
    rect(g, 560, py + 5, 62, 1, '#2a1c11');
  }
  inter.push({ x: 560, y: GY - 52, w: 62, h: 52, prompt: 'prompt_look', lines: 'c2_pallets', range: 32 });

  punchClock(g, 700, 138);
  inter.push({ x: 696, y: 136, w: 26, h: 30, prompt: 'prompt_look', lines: 'c2_clock', range: 26 });

  // Atalho do posto de seguranca. Primeiro ele ve a porta sem energia;
  // depois de resolver o quadro, ela vira o retorno curto para o corredor.
  const dSec = M.doorFrame(g, 770, GY, 5166);
  inter.push({
    x: dSec.x, y: dSec.y, w: dSec.w, h: dSec.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_security', tox: 650, tofacing: -1, range: 30,
    isDoor: true, precisa: 'puzzle_solved', semChave: 'b2_security_locked',
  });
  rect(g, 764, GY, 38, 3, '#2b2620');

  // escada de metal para o escritorio suspenso
  const ESC = 860;
  rect(g, ESC, 96, 76, 5, '#3d434b');
  rect(g, ESC, 96, 76, 2, '#4f565f');
  for (let i = 0; i < 9; i++) {
    rect(g, ESC + 4 + i * 8, 101 + i * 12, 20, 3, '#3d434b');
    rect(g, ESC + 4 + i * 8, 101 + i * 12, 20, 1, '#525a64');
  }
  rect(g, ESC + 72, 96, 3, GY - 96, '#33383f');
  // caixa do escritorio suspenso, vista por fora
  rect(g, ESC - 6, 40, 130, 58, '#2b3037');
  rect(g, ESC - 6, 40, 130, 3, '#3d454f');
  rect(g, ESC + 4, 50, 46, 30, '#6a5a30');
  rect(g, ESC + 56, 50, 46, 30, '#6a5a30');
  rect(g, ESC + 4, 50, 46, 3, '#8d7a42');
  rect(g, ESC + 56, 50, 46, 3, '#8d7a42');
  lights.push({ x: ESC + 54, y: 66, r: 132, color: '#dfae64', i: 0.5, falloff: 1.15 });
  inter.push({
    x: ESC + 20, y: GY - 40, w: 40, h: 40, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_office', tox: 76, tofacing: 1, range: 34,
  });

  dockGate(g, 980, GY, 104, 5171);
  inter.push({
    x: 980, y: GY - 108, w: 104, h: 108, prompt: 'prompt_look',
    lines: 'c2_dockgate', range: 46, id: 'doca',
  });

  M.crate(g, 1140, GY, 1, 5181);
  M.crate(g, 1164, GY, 0, 5191);
  M.crate(g, 1146, GY - 17, 0, 5201);
  // porta do arquivo morto
  const dArq = M.doorFrame(g, 1180, GY, 5215);
  inter.push({
    x: dArq.x, y: dArq.y, w: dArq.w, h: dArq.h, prompt: 'prompt_open',

  });
  rect(g, 1174, GY, 38, 3, '#2b2620');
  M.debris(g, 1250, GY, 44, 5211);
  M.puddle(g, 700, GY + 12, 70, 5221);
  M.puddle(g, 1290, GY + 16, 52, 5231);

  // correntes penduradas
  for (const cx of [330, 760, 1210, 1560]) {
    for (let i = 0; i < 34 + (cx % 26); i++) rect(g, cx + (i % 2), 14 + i * 2, 2, 1, '#2a2e33');
  }

  // A ripa de palete. Encostada numa coluna. Em pe.
  const COL = 1320;
  rect(g, COL, 30, 12, GY - 30, '#333941');
  rect(g, COL, 30, 3, GY - 30, '#454c56');
  rect(g, COL - 3, GY - 6, 18, 6, '#262b31');
  inter.push({
    x: COL + 10, y: GY - 46, w: 14, h: 46, prompt: 'prompt_take',
    action: 'take_club', range: 26, id: 'porrete',
  });

  // porta para o setor B
  const dB = M.doorFrame(g, 1640, GY, 5241);
  inter.push({
    x: dB.x, y: dB.y, w: dB.w, h: dB.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_shelves', tox: 70, tofacing: 1, range: 30, isDoor: true,
  });

  // ---- luz ----
  //
  // Esta e a licao do B-23, e ela custou duas sessoes: luz calibrada para
  // uma sala nao serve num corredor de mil e setecentos pixels. Se as
  // lampadas ficam a 450px uma da outra, o meio do caminho e preto e o
  // jogador perde o proprio corpo de vista — e o setor que existe para
  // MOSTRAR o tamanho do lugar vira o setor onde nao se ve nada.
  //
  // A regra que ficou: lampada forte a cada ~400px, mais um preenchimento
  // fraco a cada ~200px na altura do chao. O escuro continua sendo o tom,
  // mas o espaco fica legivel.
  for (const lx of [240, 690, 1180, 1620]) {
    emergencyLamp(g, lx, 58);
    lights.push({ x: lx + 7, y: 68, r: 210, color: '#c98a5e', i: 0.72, falloff: 1.1 });
    lights.push({ x: lx + 7, y: 68, r: 30, color: '#ffd8a8', i: 0.55 });
    lights.push({ x: lx + 7, y: 196, r: 140, color: '#a8804e', i: 0.3, falloff: 1.35 });
  }
  for (const lx of [90, 460, 900, 1120, 1400, 1560]) {
    lights.push({ x: lx, y: 168, r: 150, color: '#7d6a52', i: 0.26, falloff: 1.4 });
  }
  // claraboias: duas facas de luar cortando o corredor
  for (const sx of [520, 1420]) {
    rect(g, sx, 0, 70, 12, '#0b0d10');
    rect(g, sx + 4, 1, 62, 9, '#3d4d63');
    rect(g, sx + 22, 1, 3, 9, '#0b0d10');
    lights.push({ x: sx + 34, y: 8, r: 210, color: '#6f8ec4', i: 0.56, falloff: 1.3 });
    lights.push({ x: sx + 34, y: 196, r: 140, color: '#5c78a8', i: 0.3, falloff: 1.4 });
  }
  // resto de luz por baixo do portao da doca
  lights.push({ x: 1032, y: 212, r: 100, color: '#b8905c', i: 0.34, falloff: 1.3 });

  const fore = makeBuffer(Math.ceil(VW + (W - VW) * 1.14) + 8, VH);
  {
    const f = fore.x;
    rect(f, 0, 0, f.canvas.width, 14, '#030202');
    rect(f, 0, VH - 8, f.canvas.width, 8, '#030202');
    for (const px of [180, 620, 1120, 1680]) rect(f, px, 0, 9, VH, '#050607');
  }

  const lvl = new Level({
    key: 'ch2_corridor',
    nameKey: 'loc_corridor',
    width: W, groundY: GY,
    ambient: '#2a3242',
    layers: [{ c: back.c, par: 0.45 }, { c: main.c, par: 1 }],
    fores: [{ c: fore.c, par: 1.14 }],
    lightDefs: lights,
    interactables: inter,
    weather: 'none',
    reflect: 0.05,
    minX: 34, maxX: W - 40,
    spawn: { x: 96, facing: 1 },
    bloom: 0.42,
    indoor: true,
    ambience: [{ n: 'hall', g: 0.12 }, { n: 'wind', g: 0.02 }],
    randomSfx: [
      { fn: 'drip', min: 4, max: 11, vol: 0.8 },
      { fn: 'metalCreak', min: 12, max: 28, vol: 0.85 },
      { fn: 'distantThump', min: 24, max: 54, vol: 0.7 },
      { fn: 'chainRattle', min: 18, max: 44, vol: 0.5 },
    ],
    // O corredor e o caminho de volta o capitulo inteiro. Ele so ganha
    // inimigos depois que o jogador ja conheceu o lugar.
    spawnTipos: ['semrosto'],
    ritmo: 42,
    maxInimigos: 2,
    esconderijos: [606, 1150],
    enterBarks: ['b2_corr_1', 'b2_corr_2'],
    barks: [
      { x: 420, key: 'b2_corr_3', range: 60 },
      { x: 520, key: 'b2_corr_4', range: 50 },
      { x: 1000, key: 'b2_corr_5', range: 60 },
    ],
  });
  lvl.docaX = 1032;
  itensSoltos(lvl, [{
    id: 'porrete', x: COL + 14, y: GY - 44,
    draw: (ctx, x, y) => {
      ctx.fillStyle = PAL.wood; ctx.fillRect(x, y, 4, 44);
      ctx.fillStyle = PAL.woodHi; ctx.fillRect(x, y, 1, 44);
      ctx.fillStyle = '#8f959e'; ctx.fillRect(x + 1, y - 2, 1, 3);
    },
  }]);
  return lvl;
}

function buildShelves() {
  const W = 1500;

  const back = makeBuffer(Math.ceil(VW + (W - VW) * 0.4) + 8, VH);
  {
    const b = back.x;
    trusses(b, b.canvas.width, VH);
    // fileiras de estante sumindo no fundo
    for (let x = 0; x < b.canvas.width; x += 150) rack(b, x, 96, 96, 118, 5400 + x, false);
    b.globalAlpha = 0.55;
    rect(b, 0, 0, b.canvas.width, VH, '#05070a');
    b.globalAlpha = 1;
  }

  const main = makeBuffer(W, VH);
  const g = main.x;
  warehouseWall(g, W, 5411, { corte: 126 });
  damp(g, [260, 700, 1160], 130);

  const inter = [];
  const lights = [];

  const ex = M.doorFrame(g, 44, GY, 5421);
  inter.push({
    x: ex.x, y: ex.y, w: ex.w, h: ex.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_corridor', tox: 1600, tofacing: -1, range: 30, isDoor: true,
  });

  // O labirinto. Estantes de tres niveis, corredores estreitos, visao
  // bloqueada — coisas se mexem duas fileiras adiante e voce nao ve o que.
  const posicoes = [160, 300, 440, 620, 760, 900, 1060, 1200, 1340];
  for (let i = 0; i < posicoes.length; i++) {
    rack(g, posicoes[i], 46 + (i % 2) * 8, 104, GY - 46 - (i % 2) * 8, 5430 + i * 7, true);
  }

  // estante desabada de dentro para fora
  {
    const x = 520;
    rect(g, x, GY - 8, 96, 8, '#3a3f47');
    rect(g, x + 10, GY - 22, 76, 5, '#454b54');
    rect(g, x + 4, GY - 40, 6, 32, '#3a3f47');
    rect(g, x + 62, GY - 52, 5, 44, '#3a3f47');

    for (let i = 0; i < 6; i++) rect(g, x + 12 + i * 13, GY - 16 - (i % 3) * 6, 11, 9, '#3d3126');
  }
  inter.push({ x: 520, y: GY - 52, w: 96, h: 52, prompt: 'prompt_look', lines: 'c2_rack', range: 34 });

  // caixas lacradas, todas vazias
  M.crate(g, 700, GY, 1, 5511);

  inter.push({ x: 700, y: GY - 36, w: 48, h: 36, prompt: 'prompt_look', lines: 'c2_boxes', range: 30 });

  // marca de arrasto: alguma coisa pesada passou por aqui, e nao faz muito
  {
    const rnd = mulberry32(5541);
    for (let i = 0; i < 120; i++) {
      const x = 1120 + i * 2.2;
      g.globalAlpha = 0.16 + rnd() * 0.16;

      rect(g, x, GY + 9 + Math.sin(i * 0.12) * 2, 2, 2, '#1a1512');
    }
    g.globalAlpha = 1;

// ---------------------------------------------------------------------------
// 4b — O BANHEIRO
//
// Existe por um motivo só: o espelho estava pendurado a dois metros do chão
// na parede do vestiário, e ninguém olha para um espelho que fica acima da
// própria cabeça. Aqui ele está onde espelho fica — em cima da pia, na
// altura do rosto de um homem de pé.
// ---------------------------------------------------------------------------

function buildBathroom() {
  const W = 420;

  const main = makeBuffer(W, VH);
  const g = main.x;

  rect(g, 0, 0, W, VH, '#191c1e');
  // azulejo branco encardido do chão ao teto
  ditherV(g, 0, 20, W, GY - 20, '#5a5c56', '#43453f', 5);
  for (let x = 0; x < W; x += 13) rect(g, x, 20, 1, GY - 20, '#33352f');
  for (let y = 20; y < GY; y += 13) rect(g, 0, y, W, 1, '#33352f');
  grainRect(g, 0, 20, W, GY - 20, ['#3d3f39', '#63655d'], 0.06, 6201);
  rect(g, 0, 0, W, 20, '#101211');
  // azulejos faltando, e o reboco atrás
  for (const [mx, my] of [[70, 60], [83, 60], [212, 112], [316, 47], [329, 60]]) {
    rect(g, mx, my, 12, 12, '#3a332c');
    grainRect(g, mx, my, 12, 12, ['#2c2620', '#463d34'], 0.2, 6211 + mx);
  }
  M.asphalt(g, 0, GY, W, VH - GY, 6221, { hi: '#43443e', mid: '#33342f', dk: '#232420' });
  rect(g, 0, GY, W, 1, '#0d0f0d');

  const inter = [];
  const lights = [];

  const ex = M.doorFrame(g, 34, GY, 6231);
  inter.push({
    x: ex.x, y: ex.y, w: ex.w, h: ex.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_locker', tox: 592, tofacing: -1, range: 30, isDoor: true,
  });

  // três cabines, uma com a porta arrancada
  for (let i = 0; i < 3; i++) {
    const cx = 240 + i * 58;
    rect(g, cx, GY - 96, 3, 96, '#5a6b64');
    rect(g, cx, GY - 96, 3, 96 - 60, '#6b7d75');
    if (i !== 1) {
      rect(g, cx + 3, GY - 92, 52, 88, '#4e5f58');
      rect(g, cx + 3, GY - 92, 52, 2, '#63756d');
      rect(g, cx + 46, GY - 52, 4, 4, '#8f959e');
    } else {
      rect(g, cx + 3, GY - 92, 52, 88, '#101413');
      // vaso, lá no fundo do escuro
      rect(g, cx + 22, GY - 26, 16, 26, '#8a8d86');
      rect(g, cx + 20, GY - 30, 20, 6, '#9a9d96');
    }
  }
  rect(g, 240, GY - 99, 178, 3, '#5a6b64');

  // ---- a bancada de pias ----
  const PIA = 96;
  rect(g, PIA - 8, 150, 118, 8, '#9a968c');
  rect(g, PIA - 8, 150, 118, 2, '#b6b2a6');
  rect(g, PIA - 8, 158, 118, 4, '#6b6860');
  for (const px of [PIA + 8, PIA + 74]) {
    rect(g, px - 10, 152, 24, 6, '#8a8780');
    rect(g, px - 2, 144, 4, 8, '#a8a49a');
    rect(g, px - 4, 142, 8, 3, '#c2beb2');
    rect(g, px + 8, 162, 4, 18, '#7f7b72');
  }

  // ★ O ESPELHO — pequeno, e na altura do rosto de quem está em pé.
  // Um homem de 62px com os pés em 214 tem os olhos por volta de 165.
  const ESP = 88, ESPY = 108;
  M.crackedMirror(g, ESP, ESPY, 40, 40, 6241);
  rect(g, ESP - 2, ESPY - 2, 44, 2, '#6b6860');
  rect(g, ESP - 2, ESPY + 40, 44, 2, '#4a4840');
  inter.push({
    x: ESP, y: ESPY, w: 40, h: 40, prompt: 'prompt_look',
    action: 'mirror', range: 26, id: 'espelho', prio: 1,
  });

  // luminária piscando em cima da pia
  rect(g, ESP - 4, 88, 48, 5, '#2a3038');
  rect(g, ESP, 93, 40, 2, '#dfe8f0');
  lights.push({ x: ESP + 20, y: 96, r: 132, color: '#cfe0f0', i: 0.62, flick: 'bulb', falloff: 1.05 });
  lights.push({ x: ESP + 20, y: 96, r: 22, color: '#ffffff', i: 0.5, flick: 'bulb' });
  lights.push({ x: 300, y: 60, r: 128, color: '#8fa8c8', i: 0.34, falloff: 1.3 });
  lights.push({ x: 200, y: 190, r: 120, color: '#6a7a86', i: 0.22, falloff: 1.4 });

  const fore = makeBuffer(Math.ceil(VW + (W - VW) * 1.15) + 8, VH);
  rect(fore.x, 0, 0, fore.c.width, 10, '#040505');
  rect(fore.x, 0, VH - 8, fore.c.width, 8, '#040505');

  return new Level({
    key: 'ch2_wc',
    nameKey: 'loc_wc',
    width: W, groundY: GY,
    ambient: '#39414e',
    layers: [{ c: main.c, par: 1 }],
    fores: [{ c: fore.c, par: 1.15 }],
    lightDefs: lights,
    interactables: inter,
    weather: 'none',
    reflect: 0.14,
    minX: 30, maxX: W - 40,
    spawn: { x: 64, facing: 1 },
    bloom: 0.5,
    indoor: true,
    safe: true,
    ambience: [{ n: 'roomtone', g: 0.1 }],
    randomSfx: [{ fn: 'drip', min: 3, max: 8, vol: 0.9 }],
    maxInimigos: 0,
    esconderijos: [298],
    enterBarks: ['b2_wc_1'],
  });
}

function buildColdStore() {
  const W = 900;

  const main = makeBuffer(W, VH);

  // aco por todo lado, e um chao que ainda tem gelo velho nos cantos
  rect(g, 0, 0, W, VH, '#161a1e');
  M.metalPanel(g, 0, 0, W, GY, 5801, { hi: '#3f464e', mid: '#2f353c', dk: '#1e2329' });
  for (let i = 0; i < 60; i++) {
    g.globalAlpha = 0.68 * (1 - i / 60);
    rect(g, 0, i, W, 1, '#04060a');
  }
  g.globalAlpha = 1;
  // rebites nas emendas
  for (let x = 20; x < W; x += 64) {
    rect(g, x, 0, 2, GY, '#252b32');
    for (let y = 16; y < GY; y += 18) rect(g, x - 1, y, 4, 2, '#454d56');
  }
  M.asphalt(g, 0, GY, W, VH - GY, 5811, { hi: '#3a4046', mid: '#2b3036', dk: '#1d2126' });
  rect(g, 0, GY, W, 1, '#0d1013');
  {
    const rnd = mulberry32(5821);
    for (let i = 0; i < 60; i++) {
      const x = rnd() * W, w = 8 + rnd() * 26;
      g.globalAlpha = 0.1 + rnd() * 0.14;
      rect(g, x, GY + 2 + rnd() * 40, w, 2 + rnd() * 3, '#9fc0e8');
    }
    g.globalAlpha = 1;
  }

  const inter = [];
  const lights = [];

  const cd = coldDoor(g, 40, GY, 5831);
  inter.push({
    x: cd.x, y: cd.y, w: cd.w, h: cd.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_locker', tox: 660, tofacing: -1, range: 32, isDoor: true, sfx: 'heavy',
  });

  // trilho de ganchos correndo pelo teto. Vinte e tres. Ou vinte e quatro.
  rect(g, 140, 30, 700, 4, '#5c626b');
  rect(g, 140, 30, 700, 1, '#767d87');
  const ganchos = [];
  for (let i = 0; i < 23; i++) {
    const gx = 160 + i * 30;
    const len = 26 + (i % 4) * 5;
    meatHook(g, gx, 34, len);
    ganchos.push({ x: gx, len });
  }
  inter.push({ x: 380, y: 34, w: 200, h: 60, prompt: 'prompt_look', lines: 'c2_hooks', range: 60 });

  // termometro
  rect(g, 120, 96, 12, 34, '#2a3038');
  rect(g, 122, 98, 8, 26, '#c9c6bd');
  rect(g, 125, 102, 2, 20, '#7a1c14');
  rect(g, 124, 120, 4, 6, '#7a1c14');
  inter.push({ x: 116, y: 94, w: 20, h: 40, prompt: 'prompt_look', lines: 'c2_thermo', range: 24 });

  M.crate(g, 700, GY, 1, 5841);
  M.crate(g, 780, GY, 0, 5851);
  M.debris(g, 620, GY, 40, 5861);

  // A luz daqui e quase nada. O isqueiro e a lanterna, e ele so aguenta
  // alguns segundos por vez.
  lights.push({ x: 60, y: 150, r: 92, color: '#8fb4e8', i: 0.22, falloff: 1.4 });
  lights.push({ x: 470, y: 20, r: 120, color: '#7d94c4', i: 0.16, falloff: 1.5 });
  lights.push({ x: 860, y: 150, r: 76, color: '#6f8ec4', i: 0.14, falloff: 1.5 });

  const fore = makeBuffer(Math.ceil(VW + (W - VW) * 1.18) + 8, VH);
  rect(fore.x, 0, 0, fore.c.width, 12, '#020304');
  rect(fore.x, 0, VH - 8, fore.c.width, 8, '#020304');

  const lvl = new Level({
    key: 'ch2_cold',
    nameKey: 'loc_cold',
    width: W, groundY: GY,
    ambient: '#12161d',
    layers: [{ c: main.c, par: 1 }],
    fores: [{ c: fore.c, par: 1.18 }],
    lightDefs: lights,
    interactables: inter,
    weather: 'none',
    reflect: 0.12,
    minX: 34, maxX: W - 50,
    spawn: { x: 70, facing: 1 },
    bloom: 0.34,
    indoor: true,
    frio: true,
    ambience: [{ n: 'freezer', g: 0.13 }],
    randomSfx: [
      { fn: 'metalCreak', min: 7, max: 18, vol: 1 },
      { fn: 'drip', min: 5, max: 13, vol: 0.6 },
    ],
    spawnTipos: ['empilhado'],
    ritmo: 34,
    maxInimigos: 1,
    esconderijos: [740],
    enterBarksNow: ['b2_cold_1'],
    barks: [
      { x: 200, key: 'b2_cold_2', range: 50 },
      { x: 300, key: 'b2_cold_3', range: 50 },
    ],
  });

  // Os ganchos balancam quando a cena manda. Todos, no mesmo ritmo, e nao
  // ha vento aqui dentro.
  lvl.ganchos = ganchos;
  lvl.balanco = 0;
  lvl.casaco = 0;
  // Onde o casaco fica pendurado. O jogo acende uma luz fraca aqui
  // enquanto ele existe: sem isso a coisa aparece num ponto que a chama do
  // isqueiro nao alcanca, e o jogador nunca ve o que ele acabou de dizer
  // que viu.
  lvl.casacoX = ganchos[11].x;
  lvl.casacoY = 34 + ganchos[11].len + 16;
  lvl.onUpdate = (dt, t) => {
    if (lvl.balanco > 0) lvl.balancoT = (lvl.balancoT || 0) + dt;
  };
  lvl.drawProps = (ctx, cam) => {

    if (rx < x + w - 3) rect(g, rx, y + i, 2, 1, '#3d4855');
  }
}

// Mesa de plantao com maquina de escrever, papel demais e um telefone.
function precinctDesk(g, x, gy, seed, comMaquina = true) {
  const rnd = mulberry32(seed);
  const w = 74, h = 30;
  const y = gy - h;
  rect(g, x, y, w, 5, '#54402a');
  rect(g, x, y, w, 1, '#6f5436');
  rect(g, x + 3, y + 5, 5, h - 5, '#3a2c1d');
  rect(g, x + w - 8, y + 5, 5, h - 5, '#3a2c1d');
  rect(g, x + 8, y + 5, w - 16, 16, '#42321f');
  for (let i = 0; i < 3; i++) rect(g, x + 12, y + 9 + i * 5, w - 24, 1, '#2b2013');
  // pilhas de papel
  for (let i = 0; i < 3; i++) {
    const px = x + 6 + Math.floor(rnd() * (w - 24));
    const ph = 3 + Math.floor(rnd() * 5);
    rect(g, px, y - ph, 15, ph, '#b6ae9a');
    rect(g, px, y - ph, 15, 1, '#d0c8b4');
    for (let l = 1; l < ph; l++) rect(g, px, y - ph + l, 15, 1, l % 2 ? '#9c9482' : '#b6ae9a');
  }
  if (comMaquina) {
    // maquina de escrever: e o som do plantao e a letra do jogo
    const mx = x + 40, my = y - 14;
    rect(g, mx, my + 6, 26, 8, '#22262b');
    rect(g, mx, my + 6, 26, 1, '#333940');
    rect(g, mx + 2, my, 22, 7, '#2b3138');
    rect(g, mx + 4, my - 4, 18, 5, '#c9c1a8');
    for (let k = 0; k < 9; k++) rect(g, mx + 3 + k * 2.4 | 0, my + 8, 1, 2, '#4a525c');
  }
  // telefone preto de disco
  rect(g, x + 10, y - 8, 16, 8, '#16181c');
  rect(g, x + 10, y - 8, 16, 1, '#282c33');
  rect(g, x + 12, y - 11, 12, 3, '#1d2026');
  rect(g, x + 15, y - 5, 6, 4, '#33383f');
}

// Arquivo de aco de corredor. Fileira inteira, para o subsolo ler como
// arquivo morto e nao como sala com um movel.
function fileRow(g, x, gy, n, seed, faltando = -1) {
  const w = 40, h = 82;
  const y = gy - h;
  const rnd = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const fx = x + i * (w + 2);
    rect(g, fx, y, w, h, '#333c46');
    rect(g, fx, y, w, 2, '#465260');
    rect(g, fx + w - 1, y, 1, h, '#1e252c');
    for (let d = 0; d < 4; d++) {
      const dy = y + 5 + d * 19;
      if (i === faltando && d === 1) { rect(g, fx + 3, dy, w - 6, 16, '#07090c'); continue; }
      rect(g, fx + 3, dy, w - 6, 16, '#3c4650');
      rect(g, fx + 3, dy, w - 6, 1, '#505c69');
      rect(g, fx + 14, dy + 6, 12, 3, '#8f959e');
      // etiqueta de letra
      rect(g, fx + 5, dy + 4, 7, 7, '#b9b0a2');
    }
    grainRect(g, fx, y, w, h, ['#232a32', '#4a5460'], 0.035, seed + i * 13);
  }
}

// Ventilador de teto. Nao e enfeite: cenario parado le como parede pintada,
// cenario que se mexe le como espaco. (ROTEIRO IX.7.B.4)
function ceilingFan(g, x, y) {
  rect(g, x - 1, y, 2, 10, '#2a3038');
  rect(g, x - 4, y + 10, 8, 3, '#39414a');
}

// Grade de cela. As barras vao ate o chao e o vao entre elas mostra o
// interior, mais escuro.
function cellBars(g, x, y, w, h, seed) {
  rect(g, x, y, w, h, '#090c10');
  grainRect(g, x + 2, y + 4, w - 4, h - 6, ['#12171d', '#080a0e'], 0.05, seed);
  for (let bx = x + 2; bx < x + w - 2; bx += 9) {
    rect(g, bx, y, 3, h, '#3b444f');
    rect(g, bx, y, 1, h, '#525d6a');
    rect(g, bx + 2, y, 1, h, '#252c34');
  }
  rect(g, x, y, w, 4, '#454f5b');
  rect(g, x, y + h - 3, w, 3, '#333b45');
  rect(g, x, y, 4, h, '#454f5b');
  rect(g, x + w - 4, y, 4, h, '#454f5b');
}

// Escaninho de armas da portaria. Numerado, e um deles e o 214.
function weaponLockers(g, x, y, cols, rows, seed, destaque = -1) {
  const cw = 17, ch = 13;
  const rnd = mulberry32(seed);
  rect(g, x - 2, y - 2, cols * cw + 4, rows * ch + 4, '#2b333c');
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      const lx = x + c * cw, ly = y + r * ch;
      const aberto = i === destaque;
      rect(g, lx, ly, cw - 1, ch - 1, aberto ? '#0a0d11' : '#3d4650');
      rect(g, lx, ly, cw - 1, 1, aberto ? '#151b21' : '#4e5964');
      if (!aberto) {
        rect(g, lx + cw - 6, ly + 5, 3, 3, '#8f959e');
        rect(g, lx + 3, ly + 4, 6, 4, '#8b8272');
      } else {
        // a arma que ja esta dentro dele
        rect(g, lx + 3, ly + 6, 9, 3, '#22262c');
        rect(g, lx + 3, ly + 5, 4, 2, '#2d3238');
      }
      if (rnd() > 0.93) rect(g, lx + 2, ly + 2, cw - 5, ch - 5, '#343d47');
    }
  }
}

// Painel de senha de atendimento. O numero sobe sozinho ao longo do
// capitulo — quem desenha o digito e o proprio jogo, por quadro.
function ticketPanel(g, x, y) {
  rect(g, x - 2, y - 2, 44, 24, '#1a1e24');
  rect(g, x - 2, y - 2, 44, 1, '#2c333c');
  rect(g, x, y, 40, 20, '#0a0d10');
  rect(g, x, y, 40, 1, '#161b21');
}

// Cadeira de espera de plastico, em fila presa por uma barra.
function waitingSeats(g, x, gy, n, seed) {
  rect(g, x, gy - 4, n * 20 + 4, 3, '#2a3038');
  for (let i = 0; i < n; i++) {
    const sx = x + 2 + i * 20;
    rect(g, sx, gy - 20, 17, 4, '#3f4a44');
    rect(g, sx, gy - 20, 17, 1, '#53605a');
    rect(g, sx + 14, gy - 34, 3, 15, '#3f4a44');
    rect(g, sx + 1, gy - 4, 2, 4, '#232930');
    rect(g, sx + 13, gy - 4, 2, 4, '#232930');
  }
  grainRect(g, x, gy - 34, n * 20 + 4, 34, ['#2a322e', '#48544e'], 0.03, seed);
}

// ---------------------------------------------------------------------------
// A REGRA NUMERICA DE LUZ
//
// Chame isto em TODO setor. Ele so acrescenta preenchimento fraco na altura
// do chao a cada `passo` pixels — as lampadas fortes continuam sendo
// colocadas a mao, onde a cena pede.
// ---------------------------------------------------------------------------

function preencher(lights, W, cor = '#8a7a60', i = 0.2, passo = 200, y = GY - 30) {
  for (let x = passo / 2; x < W; x += passo) {
    lights.push({ x: Math.round(x), y, r: 118, color: cor, i, falloff: 1.35 });
  }
  return lights;
}

// Confere a regra e devolve o que falta. Usado pelo teste de regressao: e
// mais barato do que descobrir de novo, na mao, que um setor ficou preto.
function auditarLuz(lvl, passoForte = 400) {
  if (!lvl || lvl.width <= 800) return { ok: true, vaos: [] };
  const xs = (lvl.lightDefs || []).filter(f => f.i >= 0.35).map(f => f.x).sort((a, b) => a - b);
  const vaos = [];
  let ant = 0;
  for (const x of xs) {
    if (x - ant > passoForte) vaos.push([ant, x]);
    ant = x;
  }
  if (lvl.width - ant > passoForte) vaos.push([ant, lvl.width]);
  return { ok: vaos.length === 0, vaos };
}

function itensSoltos(lvl, defs) {
  lvl.pego = lvl.pego || {};
  lvl.itemDefs = (lvl.itemDefs || []).concat(defs);
  const antes = lvl.drawProps;
  lvl.drawProps = (ctx, cam) => {
    if (antes) antes(ctx, cam);
    for (const d of defs) {
      if (d.disabled || lvl.pego[d.id] || (d.visible && !d.visible())) continue;
      d.draw(ctx, Math.round(d.x - cam.ix), Math.round(d.y - cam.iy));
    }
  };
}

// 1 — RUA E RECEPCAO
// ---------------------------------------------------------------------------
// FUNCAO: transicao da chuva. Tirar a arma do jogador sem roubar nada dele.
// E a sala de espera, onde o Credor esta sentado com uma senha na mao.

function buildReception() {
  const W = 1080;

  // fundo: a rua molhada continua visivel pela porta de vidro
  const back = makeBuffer(Math.ceil(VW + (W - VW) * 0.45) + 8, VH);
  {
    const b = back.x;
    rect(b, 0, 0, b.canvas.width, VH, '#070a0f');
    ditherV(b, 0, 30, b.canvas.width, 130, '#131a24', '#070a0f', 6);
    for (let i = 0; i < 5; i++) {
      M.buildingSilhouette(b, i * 150 - 20, 150, 110, 100 + i * 9, '#0d1218', 9101 + i, true);
    }
  }

  const main = makeBuffer(W, VH);
  const g = main.x;

  // parede de pedra encardida, rodape de azulejo institucional
  rect(g, 0, 0, W, VH, '#171b21');
  M.brickWall(g, 0, 20, W, GY - 20, 9111, { hi: '#4a4a44', mid: '#36362f', dk: '#232320' });
  rect(g, 0, GY - 52, W, 52, '#2b3138');
  for (let x = 0; x < W; x += 16) rect(g, x, GY - 52, 1, 52, '#232930');
  for (let y = GY - 52; y < GY; y += 16) rect(g, 0, y, W, 1, '#232930');
  rect(g, 0, GY - 54, W, 3, '#3d4650');
  rect(g, 0, 0, W, 20, '#101318');
  M.asphalt(g, 0, GY, W, VH - GY, 9121, { hi: '#3c3a36', mid: '#2c2a27', dk: '#1d1c1a' });
  rect(g, 0, GY, W, 1, '#0b0a09');

  const inter = [];
  const lights = [];

  // ---- a escadaria e a porta da rua (esquerda) ----
  for (let i = 0; i < 4; i++) rect(g, 20, GY - 4 - i * 3, 60 - i * 8, 3, '#3a3833');
  rect(g, 36, GY - 16, 3, 16, '#4a4842');   // o degrau solto
  inter.push({ x: 28, y: GY - 20, w: 40, h: 20, prompt: 'prompt_look', lines: 'c3_step', range: 26 });

  // ---- balcao da portaria ----
  //
  // A ENCENACAO E O TRUQUE INTEIRO AQUI. O balcao estava pintado na camada
  // de tras e o vidro era um retangulo preto solido: o plantonista era
  // desenhado DEPOIS da camada, entao ele flutuava na frente do movel, e
  // mesmo se estivesse atras nao daria para ver nada atraves do vidro.
  //
  // Agora: o nicho e a bancada ficam ATRAS (aqui). A frente do balcao e a
  // moldura do vidro vao para uma camada de PRIMEIRO PLANO em 1:1 (`guiche`,
  // no fim da funcao), que e desenhada depois das pessoas. Assim ele fica
  // sentado DENTRO da guarita, com as pernas escondidas pelo balcao e a
  // cabeca e o tronco aparecendo pelo vidro e pela abertura.
  const BAL = 250;
  // nicho: a parede do fundo da guarita, mais escura que a sala
  rect(g, BAL + 4, GY - 96, 112, 96, '#161c22');
  ditherV(g, BAL + 4, GY - 96, 112, 60, '#1e262e', '#12181e', 5);
  // prateleira de fichario atras dele, para o nicho nao ser um vazio
  rect(g, BAL + 10, GY - 90, 44, 5, '#2f3a44');
  for (let i = 0; i < 5; i++) rect(g, BAL + 12 + i * 8, GY - 100, 6, 10, '#5a5140');
  // a bancada em que ele trabalha, POR DENTRO
  rect(g, BAL + 6, GY - 40, 108, 4, '#54402a');
  rect(g, BAL + 6, GY - 40, 108, 1, '#6f5436');
  // papel e um telefone em cima dela
  rect(g, BAL + 16, GY - 45, 14, 5, '#b6ae9a');
  rect(g, BAL + 84, GY - 48, 16, 8, '#16181c');
  rect(g, BAL + 86, GY - 51, 12, 3, '#1d2026');
  // banco alto: e por isso que a cabeca dele chega na altura do vidro
  rect(g, BAL + 52, GY - 26, 16, 4, '#3a2c1d');
  rect(g, BAL + 55, GY - 22, 3, 22, '#2f251a');
  rect(g, BAL + 62, GY - 22, 3, 22, '#2f251a');
  lights.push({ x: BAL + 60, y: GY - 70, r: 128, color: '#e8bc80', i: 0.62, falloff: 1.0 });
  lights.push({ x: BAL + 60, y: GY - 52, r: 74, color: '#ffdca8', i: 0.4 });

  // ---- os escaninhos de arma, e o 214 ----
  const ESC = 400;
  weaponLockers(g, ESC, GY - 96, 6, 4, 9131, 13);
  inter.push({
    x: ESC, y: GY - 96, w: 104, h: 56, prompt: 'prompt_use',
    action: 'ch3_escaninho', range: 30, id: 'escaninho', prio: 1,
  });
  lights.push({ x: ESC + 50, y: GY - 100, r: 108, color: '#a89a70', i: 0.4, falloff: 1.15 });

  // ---- quadro de homenagens: a foto dele ainda esta la ----
  const QUA = 560;
  rect(g, QUA, GY - 108, 96, 54, '#2f2419');
  rect(g, QUA + 2, GY - 106, 92, 50, '#463726');
  for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) {
    rect(g, QUA + 6 + c * 18, GY - 102 + r * 24, 14, 18, '#6d6455');
    rect(g, QUA + 8 + c * 18, GY - 100 + r * 24, 10, 8, '#8f8472');
  }
  inter.push({ x: QUA, y: GY - 108, w: 96, h: 54, prompt: 'prompt_look', lines: 'c3_wall', range: 30 });

  // ---- SALA DE ESPERA: as cadeiras, o painel de senha, e o Credor ----
  const ESP = 700;
  waitingSeats(g, ESP, GY, 6, 9141);
  ticketPanel(g, ESP + 44, GY - 118);
  inter.push({ x: ESP + 40, y: GY - 122, w: 48, h: 28, prompt: 'prompt_look', action: 'ch3_senha', range: 30 });
  // a cadeira do lado da dele: da para sentar, e nao acontece nada
  inter.push({
    x: ESP + 22, y: GY - 34, w: 20, h: 34, prompt: 'prompt_use',
    action: 'ch3_sentar', range: 22, id: 'cadeira',
  });
  lights.push({ x: ESP + 60, y: 30, r: 190, color: '#b9c4b0', i: 0.62, flick: 'neon', falloff: 1.0 });
  lights.push({ x: ESP + 60, y: 30, r: 26, color: '#e6f0e0', i: 0.5 });

  // ---- porta para o plantao (direita) ----
  const ex = M.doorFrame(g, W - 90, GY, 9151);
  inter.push({
    x: ex.x, y: ex.y, w: ex.w, h: ex.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch3_plantao', tox: 70, tofacing: 1, range: 30, isDoor: true, prio: 1,
  });
  lights.push({ x: W - 70, y: GY - 90, r: 150, color: '#c8a06a', i: 0.5, falloff: 1.1 });

  // fluorescentes ao longo do teto — a regra dos 400px, a mao
  for (let x = 120; x < W; x += 380) {
    rect(g, x - 20, 24, 40, 4, '#39414a');
    rect(g, x - 17, 28, 34, 2, '#e8f0e0');
    lights.push({ x, y: 32, r: 172, color: '#b6c2b4', i: 0.5, flick: 'neon', falloff: 1.1 });
  }
  preencher(lights, W, '#8a8a74', 0.2);

  // ---- A GUARITA, em primeiro plano 1:1 ----
  //
  // Camada propria porque ela precisa alinhar EXATAMENTE com o cenario
  // (par: 1) e ainda assim ser desenhada depois das pessoas. A coluna e o
  // teto, mais adiante, ficam noutra camada com paralaxe maior.
  const guiche = makeBuffer(W, VH);
  {
    const q = guiche.x;
    // a frente do balcao: e ela que esconde as pernas dele
    rect(q, BAL, GY - 40, 120, 40, '#43321f');
    rect(q, BAL, GY - 40, 120, 3, '#5e482c');
    rect(q, BAL, GY - 42, 120, 2, '#6f5436');
    grainRect(q, BAL, GY - 40, 120, 40, ['#33261a', '#5e482c'], 0.05, 9161);
    // vidro: so moldura, montantes e dois riscos de reflexo. O resto e
    // transparente — o jogador PRECISA ver a pessoa do outro lado.
    rect(q, BAL + 4, GY - 96, 112, 3, '#39434f');
    rect(q, BAL + 4, GY - 96, 3, 56, '#2f3843');
    rect(q, BAL + 113, GY - 96, 3, 56, '#2f3843');
    rect(q, BAL + 4, GY - 43, 112, 3, '#2b333c');
    for (const mx of [BAL + 36, BAL + 82]) rect(q, mx, GY - 96, 2, 56, '#2b333c');
    for (let i = 0; i < 34; i += 2) {
      rect(q, BAL + 10 + i, GY - 92 + i, 2, 1, '#4a5768');
      rect(q, BAL + 88 + (i >> 1), GY - 90 + i, 1, 1, '#3d4855');
    }
    // A ABERTURA. Fica em frente ao rosto dele, e e por onde a conversa
    // acontece: um recorte limpo, sem vidro nenhum na frente.
    q.clearRect(BAL + 42, GY - 62, 34, 20);
    rect(q, BAL + 42, GY - 64, 34, 2, '#6f5436');
    rect(q, BAL + 42, GY - 42, 34, 2, '#6f5436');
  }

  // PRIMEIRO PLANO: uma coluna e um cabo atravessam NA FRENTE do personagem.
  // Oclusao em primeiro plano e o maior ganho de profundidade de um
  // side-scroller, e e o que menos existia no jogo. (ROTEIRO IX.7.B.1)
  const fore = makeBuffer(Math.ceil(VW + (W - VW) * 1.25) + 8, VH);
  {
    const f = fore.x;
    rect(f, 0, 0, f.canvas.width, 12, '#040507');
    rect(f, 0, VH - 8, f.canvas.width, 8, '#040507');
    for (const cx of [150, 620, 1010]) {
      rect(f, cx, 0, 16, VH, '#0a0c10');
      rect(f, cx, 0, 2, VH, '#151a20');
      rect(f, cx + 14, 0, 2, VH, '#06080b');
    }
  }

  const lvl = new Level({
    key: 'ch3_reception',
    nameKey: 'loc_reception',
    width: W, groundY: GY,
    ambient: '#333d4c',
    layers: [{ c: back.c, par: 0.45 }, { c: main.c, par: 1 }],
    // A guarita vem ANTES da coluna: as duas sao primeiro plano, mas a
    // guarita anda junto com o cenario (1:1) e a coluna anda mais rapido.
    fores: [{ c: guiche.c, par: 1 }, { c: fore.c, par: 1.25 }],
    lightDefs: lights,
    interactables: inter,
    weather: 'none',
    reflect: 0.08,
    minX: 24, maxX: W - 44,
    spawn: { x: 44, facing: 1 },
    bloom: 0.44,
    indoor: true, safe: true,
    material: 'tile',
    ambience: [{ n: 'roomtone', g: 0.11 }, { n: 'hum', g: 0.03 }],
    randomSfx: [{ fn: 'phoneRing', min: 22, max: 50, vol: 0.22 }],
    maxInimigos: 0,
    enterBarks: ['b3_rec_1', 'b3_rec_2'],
    barks: [
      { x: 420, key: 'b3_rec_3' },
      { x: 700, key: 'b3_rec_4' },
    ],
  });
  return lvl;
}

// ---------------------------------------------------------------------------
// 2 — O PLANTAO
// ---------------------------------------------------------------------------
// FUNCAO: o maior bloco de conversa do jogo ate aqui. MICHAEL.

function buildSquadRoom() {
  const W = 1400;

  const back = makeBuffer(Math.ceil(VW + (W - VW) * 0.5) + 8, VH);
  {
    const b = back.x;
    rect(b, 0, 0, b.canvas.width, VH, '#0a0e13');
    // SALAS ATRAS DA PAREDE: tres comodos, cada um mais escuro
    glassPartition(b, 20, 46, 150, 110, 9201, '#101720');
    glassPartition(b, 200, 52, 130, 104, 9211, '#0d141b');
    glassPartition(b, 360, 46, 170, 110, 9221, '#0b1118');
    glassPartition(b, 560, 52, 140, 104, 9231, '#0e151c');
  }

  const main = makeBuffer(W, VH);
  const g = main.x;

  rect(g, 0, 0, W, VH, '#181c22');
  // gesso institucional, rodape verde de reparticao
  ditherV(g, 0, 22, W, 96, '#4c5348', '#343a32', 6);
  grainRect(g, 0, 22, W, 96, ['#2a2f28', '#575f52', '#1e221c'], 0.055, 9241);
  rect(g, 0, GY - 96, W, 44, '#2f3a33');
  rect(g, 0, GY - 98, W, 3, '#425046');
  M.woodPanel(g, 0, GY - 52, W, 52, 9251, { hi: '#54402a', mid: '#3d2e1e', dk: '#261c12' });
  rect(g, 0, 0, W, 22, '#0e1116');
  M.asphalt(g, 0, GY, W, VH - GY, 9261, { hi: '#403c34', mid: '#302d27', dk: '#201e1a' });
  rect(g, 0, GY, W, 1, '#0c0b09');

  const inter = [];
  const lights = [];

  // volta para a recepcao
  const ex0 = M.doorFrame(g, 30, GY, 9271);
  inter.push({
    x: ex0.x, y: ex0.y, w: ex0.w, h: ex0.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch3_reception', tox: 990, tofacing: -1, range: 30, isDoor: true, prio: 1,
  });

  // ---- as quatro mesas ----
  const MESAS = [200, 430, 700, 980];
  for (let i = 0; i < MESAS.length; i++) precinctDesk(g, MESAS[i], GY, 9281 + i * 17, i !== 2);

  // MICHAEL na mesa em frente a que era do David
  // os tres colegas — quatro versoes da mesma noite

  // ---- o relogio de parede: 02h14, e o ponteiro de segundos ANDA ----
  const REL = 620;
  rect(g, REL, 40, 30, 30, '#2a2620');
  rect(g, REL + 2, 42, 26, 26, '#cfc6b0');

// ---------------------------------------------------------------------------
// 5 — SETE ANOS ATRAS  (flashback jogavel)  —  A RUA
// ---------------------------------------------------------------------------
// FUNCAO: mostrar que ele era BOM. E fazer o jogador executar o gesto.
//
// Paleta menos dessaturada — ainda noite, mas com azul e verde vivos. Sem
// inimigo, sem sanidade, sem perigo. O ocio dele e outro: ele ACENDE e FUMA,
// sem hesitar. O jogador vai ver isso dezenas de vezes sem entender por que.
//
// A rua e so o caminho. O flashback ACONTECE DENTRO DA CASA — ver
// buildHome() logo abaixo. A varanda desta fase e onde ele atende, e onde
// ele esta quando ouve.

function buildSevenYears() {
  const W = 1150;

  const back = makeBuffer(Math.ceil(VW + (W - VW) * 0.4) + 8, VH);
  {
    const b = back.x;
    rect(b, 0, 0, b.canvas.width, VH, '#0e1826');
    ditherV(b, 0, 20, b.canvas.width, 140, '#1d3048', '#0e1826', 6);
    for (let i = 0; i < 6; i++) {
      M.buildingSilhouette(b, i * 140 - 30, 156, 104, 88 + i * 11, '#152234', 9601 + i, true);
    }
  }

  const main = makeBuffer(W, VH);
  const g = main.x;

  rect(g, 0, 0, W, VH, '#12202e');
  M.brickWall(g, 0, 26, W, GY - 26, 9611, { hi: '#6a5442', mid: '#4e3d30', dk: '#33281f' });
  rect(g, 0, 0, W, 26, '#0b1420');
  M.asphalt(g, 0, GY, W, VH - GY, 9621, { hi: '#454a44', mid: '#343833', dk: '#232622' });
  rect(g, 0, GY, W, 1, '#0d100e');

  const inter = [];
  const lights = [];

  // ---- o carro dele, parado na frente de casa ----
  const CAR = 150;
  rect(g, CAR, GY - 34, 96, 22, '#2c3a4a');
  rect(g, CAR + 4, GY - 34, 88, 2, '#3f5266');
  rect(g, CAR + 18, GY - 48, 54, 15, '#243040');
  rect(g, CAR + 22, GY - 45, 20, 10, '#4a6480');
  rect(g, CAR + 46, GY - 45, 22, 10, '#4a6480');
  for (const wx of [CAR + 12, CAR + 70]) {
    rect(g, wx, GY - 14, 16, 14, '#14181d');
    rect(g, wx + 4, GY - 10, 8, 7, '#2e343c');
  }
  inter.push({ x: CAR, y: GY - 48, w: 96, h: 48, prompt: 'prompt_look', lines: 'c3_past_car', range: 30 });

  // ---- A CASA: janelas acesas, e a porta que ele ABRE ----
  const CASA = 500;
  M.brickWall(g, CASA, GY - 150, 340, 150, 9641, { hi: '#7a5f46', mid: '#5a4534', dk: '#3a2c21' });
  rect(g, CASA - 8, GY - 156, 356, 8, '#4a3a2c');
  rect(g, CASA - 8, GY - 158, 356, 3, '#63503c');
  for (const wx of [CASA + 26, CASA + 250]) {
    const wy = GY - 128;
    rect(g, wx, wy, 44, 38, '#22303c');
    rect(g, wx + 3, wy + 3, 38, 32, '#ffd9a0');
    rect(g, wx + 20, wy + 3, 2, 32, '#c9a870');
    rect(g, wx + 3, wy + 18, 38, 2, '#c9a870');
    lights.push({ x: wx + 22, y: wy + 18, r: 132, color: '#ffcf90', i: 0.7, falloff: 1.0 });
  }

  // A PORTA DA FRENTE. Ele entra por aqui — e e a coisa mais importante
  // desta fase. Antes ela era enfeite e o flashback inteiro acontecia na
  // calcada, olhando uma fachada.
  const PORTA = CASA + 148;
  rect(g, PORTA - 4, GY - 80, 42, 80, '#33261a');
  rect(g, PORTA, GY - 76, 34, 76, '#43331f');
  rect(g, PORTA + 26, GY - 44, 3, 3, '#c8b070');
  rect(g, PORTA, GY - 3, 34, 3, '#ffd9a0');
  lights.push({ x: PORTA + 17, y: GY - 40, r: 108, color: '#ffcf90', i: 0.56, falloff: 1.1 });
  inter.push({
    x: PORTA - 4, y: GY - 80, w: 42, h: 80, prompt: 'prompt_open',
    action: 'goto', to: 'ch3_home', tox: 70, tofacing: 1, range: 32, isDoor: true, prio: 1,
  });

  // ---- A VARANDA: e aqui que ele atende, e e aqui que ele ouve ----
  const VAR = CASA + 210;
  rect(g, VAR, GY - 8, 110, 8, '#4a3a2c');
  rect(g, VAR, GY - 10, 110, 2, '#63503c');
  rect(g, VAR + 6, GY - 42, 3, 34, '#3a2c21');
  rect(g, VAR + 96, GY - 42, 3, 34, '#3a2c21');
  rect(g, VAR + 6, GY - 44, 96, 3, '#4a3a2c');
  // um banco e um cinzeiro de varanda: e o lugar dele
  rect(g, VAR + 30, GY - 24, 40, 5, '#54402a');
  rect(g, VAR + 33, GY - 19, 4, 19, '#3a2c1d');
  rect(g, VAR + 63, GY - 19, 4, 19, '#3a2c1d');
  inter.push({ x: VAR + 26, y: GY - 30, w: 50, h: 30, prompt: 'prompt_look', lines: 'c3_past_porch', range: 26 });

  // O PONTO ONDE ELE ATENDE. Nao ha objeto: o telefone e o dele, esta no
  // bolso, e toca. O interagivel so aparece quando toca.
  inter.push({
    x: VAR + 40, y: GY - 60, w: 30, h: 60, prompt: 'prompt_use',
    action: 'ch3_atender', range: 30, id: 'atender', prio: 2, disabled: true,
  });

  for (let x = 200; x < W; x += 380) {
    M.streetLampPost(g, x, GY, 92);
    lights.push({ x, y: GY - 92, r: 186, color: '#e0c088', i: 0.62, falloff: 1.0 });

// Procura uma deducao para o par (ordem nao importa). Devolve { id, ...def }.
function findDeduction(k1, k2) {
  if (!k1 || !k2 || k1 === k2) return null;
  for (const id in DEDUCTIONS) {
    const d = DEDUCTIONS[id];
    if ((d.a === k1 && d.b === k2) || (d.a === k2 && d.b === k1)) return { id, ...d };
  }
  return null;
}

// Resolve um par {pt, en} no idioma atual. Usado por conversas, caderno e
// inventario, que guardam o texto junto do dado em vez de numa chave.
function tx(o) {
  if (!o) return '';
  return o[lang] !== undefined ? o[lang] : o.pt;
}

function line(key, idx) {
  const arr = LINES[key];
  if (!arr || !arr[idx]) return '';
  return arr[idx][lang] !== undefined ? arr[idx][lang] : arr[idx].pt;
}

function lineCount(key) {
  return LINES[key] ? LINES[key].length : 0;
}

const SPEAKER = {
  self: { pt: 'EU', en: 'ME' },
};

function speaker(id) {
  const s = SPEAKER[id];
  if (!s) return '';
  return s[lang] !== undefined ? s[lang] : s.pt;
}

    // `setTimeout` congelam este numero e conferem depois: sem isso, sair
    // para o menu, carregar um save ou trocar de capitulo no meio de uma
    // cena deixava o relogio correndo e o jogador era arrancado de onde
    // estava, segundos depois, no meio de outra partida.
    this.runId = 0;
    this.shiftPuzzle = new ShiftPuzzle();
    this.director = new Director();
    this.chase = new Chase();
    this.finishers = new CombatFinishers();
    this.director.difficulty = this.diff;
    this.chase.difficulty = this.diff;
    this.npcs = {};
    for (const id of Object.keys(NPCS)) this.npcs[id] = new Npc(id);
    this.player.onClubHit = () => this.golpeDePorrete();
    this.player.onPunchHit = () => this.golpeDeSoco();
    this.player.onShot = (x, f, a) => this.tiro(x, f, a);
    this.player.onNoise = () => {};
    this.player.onHurt = (n) => { this.sanity.drain(n * 0.35, true); };
    this.inv.onUse = (key) => this.usarItem(key);
    this.sanity.onEvent = (tipo) => this.eventoSanidade(tipo);
    this.shiftPuzzle.onChange = (rot) => { this.flags.puzzleRot = rot; };
    this.shiftPuzzle.onSolved = (rot) => {
      this.flags.puzzleRot = rot;
      this.flags.puzzle_solved = true;
      const sec = this.levels.ch2_security;
      if (sec) {
        sec.keyVisible = !this.flags.chave && !(sec.pego && sec.pego.chave);
        const key = sec.interactables.find(i => i.id === 'chave');
        if (key) key.disabled = !sec.keyVisible;
      }
      this.sanity.restore(4);
      this.anotar('j_puzzle');
    };
    this.shiftPuzzle.onClose = (solved) => {
      if (solved) this.player.sayAll(['b2_puzzle_done_1', 'b2_puzzle_done_2'], true);
    };

    set(this.narrationUrl ? 'PRESSIONE QUALQUER TECLA' : 'PRESSIONE QUALQUER TECLA');
    this.state = 'waitkey';

    // O laco engole erros de um quadro so. Um soluco isolado (um gradiente
    // com numero invalido, um sprite que ainda nao existe) nao pode matar a
    // sessao inteira; tres erros seguidos, ai sim, para e mostra a tela de
    // erro — nesse ponto o jogo esta quebrado de verdade.
    let last = performance.now();
    let seguidos = 0;
    const loop = (ts) => {
      let dt = (ts - last) / 1000;
      last = ts;
      // dt pode vir negativo no primeiro quadro (o carimbo do rAF as vezes e
      // anterior ao performance.now() lido antes dele) ou absurdo depois de a
      // aba ficar minimizada. Os dois estragam a fisica.
      if (!(dt > 0)) dt = 1 / 60;
      if (dt > 0.05) dt = 0.05;
      try {
        this.tick(dt);
        seguidos = 0;
      } catch (e) {
        seguidos++;
        this.lastError = e;
        if (seguidos >= 3) {
          if (window.__crash) {
            window.__crash('Erro no laco do jogo (3 quadros seguidos)',
              (e && e.stack) ? e.stack : String(e));
          }
          return;   // para o laco: continuar so geraria mil erros iguais
        }
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  applySettings() {
    audio.setVolumes({
      master: settings.master, music: settings.music,
      sfx: settings.sfx, voice: settings.voice,
    });
    gfx.scanlines = settings.scanlines;
    gfx.grainAmount = settings.grain;
    gfx.pixelPerfect = settings.pixelPerfect;
    gfx.resize();
    this.diff = difficulty(settings.difficulty || 'hard');
    if (this.director) this.director.difficulty = this.diff;
    if (this.chase) this.chase.difficulty = this.diff;
    settings.lang = getLang();
    save.saveSettings(settings);
    if (this.menu) this.menu.refresh();
  }

  // -------------------------------------------------------------------
  // laco
  // -------------------------------------------------------------------

  tick(dt) {
    this.frames++; this.fpsT += dt;
    if (this.fpsT >= 0.5) { this.fps = this.frames / this.fpsT; this.frames = 0; this.fpsT = 0; }

    input.update(dt);

    if (this.state === 'waitkey') {
      if (input.anyPress || input.mouse.pressed) {
        document.getElementById('boot').classList.add('gone');
        document.body.classList.add('playing');
        audio.ensure();
        this.toMenu();
      }
      input.flush();
      return;
    }

    if (input.pressed('debug')) this.debug = !this.debug;

    if (this.transition) this.updateTransition(dt);

    switch (this.state) {
      case 'menu': this.updateMenu(dt); break;
      case 'cutscene': this.updateCutscene(dt); break;
      case 'chapcard': this.updateChapCard(dt); break;
      case 'carregando': this.updateCarregando(dt); break;
      case 'play': this.updatePlay(dt); break;
      case 'endcard': this.updateEndCard(dt); break;
      case 'gameover': this.updateGameOver(dt); break;
      case 'lab': this.updateLab(dt); break;
    }

    audio.updateMusic();
    input.flush();
  }

  updateTransition(dt) {
    const tr = this.transition;
    tr.t += dt;
    if (tr.phase === 'out') {
      gfx.fade = clamp(tr.t / tr.outDur, 0, 1);
      if (tr.t >= tr.outDur) {
        tr.phase = 'in'; tr.t = 0;
        if (tr.action) tr.action();
      }
    } else {
      gfx.fade = 1 - clamp(tr.t / tr.inDur, 0, 1);
      if (tr.t >= tr.inDur) { gfx.fade = 0; this.transition = null; }
    }
  }

  fadeTo(action, outDur = 0.55, inDur = 0.7) {
    if (this.transition) return;
    this.transition = { t: 0, phase: 'out', outDur, inDur, action };
  }

  // -------------------------------------------------------------------
  // MENU
  // -------------------------------------------------------------------

  toMenu() {
    this.runId++;   // invalida qualquer cena roteirizada ainda no relogio
    this.state = 'menu';
    this.scene = null;
    if (this.menuSlots) this.menuSlots.open = false;
    if (this.menuChapters) this.menuChapters.open = false;
    audio.stopDread(0.3);
    audio.stopAllLoops();
    audio.stopNarration();
    gfx.eyelid = 1;
    this.menu.refresh();
    this.menu.enter();
    gfx.letterbox = 0;
  }

  updateMenu(dt) {
    if (!this.menuChapters) this.menuChapters = new ChapterPicker();
    const blocked = this.menuSlots.open || this.menuOptions.open
      || this.menuChapters.open || !!this.transition;
    const act = this.menu.update(dt, blocked);

    if (this.menuSlots.open) this.menuSlots.update(dt);
    else if (this.menuOptions.open) this.menuOptions.update(dt);
    else if (this.menuChapters.open) this.menuChapters.update(dt);

    if (act === 'chapters') {
      this.menuChapters.show((n) => this.fadeTo(() => this.startChapter(n), 0.8, 0.01), () => {});
    } else if (act === 'new') this.fadeTo(() => this.startNewGame(), 0.8, 0.01);
    else if (act === 'continue') {
      const i = save.mostRecent();
      if (i >= 0) this.fadeTo(() => this.loadSlot(i), 0.7, 0.7);
    } else if (act === 'load') {
      this.menuSlots.show('load', (i) => this.fadeTo(() => this.loadSlot(i), 0.6, 0.7), () => {});
    } else if (act === 'options') {
      this.menuOptions.show(() => this.applySettings());
    } else if (act === 'lab') {
      this.fadeTo(() => this.startLab(), 0.5, 0.5);
    } else if (act === 'combatlab') {
      this.fadeTo(() => this.startCombatLab(), 0.5, 0.5);
    }

    // desenho
    gfx.begin('#000');
    this.menu.draw(gfx.s);
    gfx.beginLights('#28324a');
    this.menu.addLights();
    gfx.endLights(0.5);
    this.menu.drawUI(gfx.s);
    this.menuSlots.draw(gfx.s);
    this.menuOptions.draw(gfx.s);
    if (this.menuChapters) this.menuChapters.draw(gfx.s);
    if (this.debug) this.drawDebug(gfx.s, 'MENU');
    gfx.present(dt);
  }

  // -------------------------------------------------------------------
  // SELETOR DE CAPITULO
  //
  // Monta o estado de um capitulo do zero, em memoria, e entra. NAO toca
  // em nenhum dos dez arquivos salvos.
  // -------------------------------------------------------------------

  startChapter(n) {
    this.runId++;
    this.playtime = 0;
    this.flags = {};
    this.qte = null;
    this.grab = null;
    this.deathRetry = null;
    this._presente = null;
    this.bloodDecals = [];
    this.cigTentativas = 0;
    this.espelhoN = 0;
    audio.stopMusic(1.0);
    audio.stopAllLoops();

    if (n === 1) {
      // O Capitulo 1 comeca onde ele sempre comecou: pela cutscene.
      this.startNewGame();
      return;
    }

    // Capitulos 2 e 3 devolvem o mundo intocado antes de montar o proprio
    // estado, senao um item pego numa sessao anterior continuaria sumido.
    this._aplicarMundo(null);
    this.resetChapter2();

    if (n === 2) {
      this.flags.supplies = this.supplies.newRun();
      const p = this.player;
      // Ele acorda do sequestro sem nada: nem arma, nem cigarro, nem carteira.
      p.hasGun = false; p.ammo = 0; p.reserve = 0;
      p.det.props.gun = 'none';
      p.club = false; p.segurarPorrete(false);
      p.hp = 100; p.det.blood = 0; p.det.coatTorn = false; p.det.injury = 0;
      this.startChapter2();
      return;
    }

    // Capitulo 3.
    this.flags.supplies = this.supplies.newRun();
    this.startChapter3();
  }

  // -------------------------------------------------------------------
  // CUTSCENE
  // -------------------------------------------------------------------

  startNewGame() {
    this.runId++;
    this.playtime = 0;
    this.flags = {};
    // jogo novo: ele tem cigarro no bolso de novo, e arma no coldre
    this.player.idleMode = null;
    this.player.hasGun = true;
    this.player.ammo = 6;
    this.player.reserve = 18;
    this.player.det.props.gun = 'holstered';
    this.player.segurarPorrete(false);
    this.player.hp = 100;
    this.player.club = false;
    this.qte = null;
    this.grab = null;
    this.deathRetry = null;
    this.resetChapter2();
    this._aplicarMundo(null);
    this.flags.supplies = this.supplies.newRun();
    audio.stopMusic(1.2);
    audio.stopAllLoops();
    this.opening = new Opening(this.road, this.car, this.player, this.rain, this.fx);
    this.fx.clear();
    this.opening.start();
    this.state = 'cutscene';
  }

  updateCutscene(dt) {
    this.playtime += dt;
    const op = this.opening;
    op.update(dt);

    gfx.begin('#000');
    op.draw(gfx.s);
    gfx.beginLights('#333f56');
    op.addLights(gfx);
    for (const L2 of this.player.det.lights(this.player.x, this.player.y)) {
      gfx.addLight(L2.x, L2.y, L2.r, L2.color, L2.i);
    }
    gfx.endLights(0.6);
    if (settings.subs) op.drawUI(gfx.s);
    else if (op.skipHold > 0.12) op.drawUI(gfx.s);
    if (this.debug) this.drawDebug(gfx.s, 'CUTSCENE ' + op.phase);
    gfx.present(dt);

    if (op.finished) {
      this.enterLevel('alley', null, 1, true);
      this.state = 'play';
      gfx.fade = 1;
      this.transition = { t: 0, phase: 'in', outDur: 0.01, inDur: 1.1, action: null };
    }
  }

  // -------------------------------------------------------------------
  // PLAY
  // -------------------------------------------------------------------

  enterLevel(key, x, facing, firstTime) {
    const lv = this.levels[key];
    this.level = lv;
    const sp = lv.spawn;
    this.player.spawn(x === null || x === undefined ? sp.x : x, facing || sp.facing, lv.groundY);
    this.cam.setBounds(0, lv.width);
    this.cam.snapTo(this.player.x, 0);
    this.rain.on = lv.weather === 'rain';
    this.rain.groundY = lv.groundY + 2;
    this.rain.intensity = lv.rainIntensity || 1;
    this.player.det.reflect = lv.reflect;
    this.player.det.visible = true;   // a cutscene esconde; entrar numa fase sempre mostra
    this.player.wet = lv.weather === 'rain';
    this.player.stepMaterial = lv.materialAt ? lv.materialAt(this.player.x)
      : (lv.material || (this.player.wet ? 'wet' : (lv.indoor ? 'concrete' : 'wet')));
    this.fx.clear();
    this.locCard = 4.0;
    this.dialogue.active = false;
    this.dialogue.fade = 0;
    this.player.clearBarks();
    this.player.frozen = false;
    this.player.controllable = true;
    this.qte = null;
    this.flags = this.flags || {};
    this.flags.visto = this.flags.visto || {};
    this.flags.barks = this.flags.barks || {};
    this.flags.visitas = this.flags.visitas || {};
    this.flags.visitas[lv.key] = (this.flags.visitas[lv.key] || 0) + 1;
    lv.revisitStage = Math.min(3, this.flags.visitas[lv.key] - 1);
    const jaViu = !!this.flags.visto[lv.key];
    if (lv.barks) for (let i = 0; i < lv.barks.length; i++) {
      lv.barks[i].done = jaViu || !!this.flags.barks[`${lv.key}:${i}`];
    }
    // Falas de entrada pertencem à descoberta do lugar. Voltar a uma sala
    // conhecida não faz David esquecer o que acabou de dizer.
    if (!jaViu) {
      if (lv.enterBarksNow) this.player.sayAll(lv.enterBarksNow, true);
      else if (lv.enterBarks) this.player.sayAll(lv.enterBarks);
    }

    // Cada lugar tem o proprio som. Antes a chuva seguia o jogador para
    // dentro de qualquer sala, o que dizia ao ouvido que nada tinha mudado.
    audio.stopAllLoops();
    for (const a of (lv.ambience || [{ n: 'roomtone', g: 0.1 }])) {
      audio.startLoop(a.n, { gain: a.g, fade: a.f || 1.5 });
    }
    if (this.chase && this.chase.ativo) {
      audio.startLoop('serra', { gain: 0.035, fade: 0.35 });
      audio.startLoop('static', { gain: 0.014, fade: 0.28 });
    }
    this.randomSfxT = [];
    if (lv.randomSfx) {
      for (const r of lv.randomSfx) this.randomSfxT.push(r.min + Math.random() * (r.max - r.min));
    }

    // Se o setor teve as luzes derrubadas por uma cena, elas voltam ao
    // entrar de novo — menos durante a perseguicao, que e quem esta
    // apagando o galpao de proposito.
    if (lv._apagada && !this.chase.ativo) {
      for (const f of lv.lightDefs) if (f.i0 !== undefined) f.i = f.i0;
      lv._apagada = false;
    }
    this.player.det.alpha = 1;
    this.mapaAberto = false;
    // A primeira fala espera o fade-in acabar, senao ela nasce e morre
    // atras da tela preta e o jogador nunca a le.
    this.player.atrasarFala(1.0);
    this.flags.visto[lv.key] = true;
    if (this.chase) this.chase.avisoEntrada(lv.key, this.player.facing);
    this.entrouCh2(lv);
    if (this.chaseSequence) this.chaseSequence.enter(this, lv);

    // O rádio do vestiário nasce ligado e só respeita o botão depois da
    // primeira interação. A flag fica no save.
    if (lv.key === 'ch2_locker' && !this.flags.radio_off) {
      audio.startLoop('static', { gain: 0.075, fade: 0.7 });
    }
  }

  updatePlay(dt) {
    const lv = this.level;
    const paused = this.pause.active;

    if (this.flags && this.flags.combat_lab && !paused && !this.transition && input.pressed('cancel')) {
      this.fadeTo(() => this.toMenu(), 0.35, 0.45);
    }

    if (!paused && !this.transition && !this.scene && !this.shiftPuzzle.open
      && !this.chaseSequence.action && !this.finishers.action && !this.flags.combat_lab
      && input.pressed('pause') && !this.dialogue.active) {
      this.pause.open();
    }

    const sim = paused ? 0 : dt;
    this.playtime += sim;
    if (this.locCard > 0) this.locCard -= sim;

    const cap2 = lv.key.slice(0, 4) === 'ch2_';
    // O Capitulo 3 usa o mesmo caderno e o mesmo casaco. Ele nao usa
    // perseguicao, puzzle, emboscada nem nada de combate.
    const cap3 = lv.key.slice(0, 4) === 'ch3_';

    // O caderno e o casaco NAO pausam o jogo. Abrir a mochila no meio do
    // galpao tem que custar alguma coisa: enquanto o casaco esta aberto,
    // ele tapa parte da tela.
    if ((cap2 || cap3) && !paused && !this.scene && !this.dialogue.active
      && !this.shiftPuzzle.open && !this.transition && !this.grab && !this.chaseSetpieces.action
      && !this.chaseSequence.action && !this.finishers.action && !this.namePrompt.ativo) {
      if (input.pressed('journal') && this.flags.caderno) {
        this.journal.toggle(); this.inv.open = false; this.mapaAberto = false;
      }
      if (input.pressed('bag')) {
        this.inv.toggle(); this.journal.open = false; this.mapaAberto = false;
      }
      if (input.pressed('map')) {
        if (this.inv.has('map')) {
          this.mapaAberto = !this.mapaAberto;
          this.journal.open = false; this.inv.open = false;
          audio.pageTurn(0.9);
        } else this.player.say('map_none', 0, true);
      }
    }
    if (cap2 || cap3) {
      this.journal.update(paused ? 0 : dt);
      this.inv.update(paused ? 0 : dt);
    }
    if (cap2) {
      this.shiftPuzzle.update(paused ? 0 : dt);
      this.chaseSetpieces.update(paused ? 0 : dt, this);
      this.chaseSequence.update(paused ? 0 : dt, this);
      this.finishers.update(paused ? 0 : dt, this);
    }
    this.mapaFade = clamp((this.mapaFade || 0) + (this.mapaAberto ? dt * 8 : -dt * 9), 0, 1);
    const uiAberta = this.journal.open || this.inv.open || this.mapaAberto || this.shiftPuzzle.open;

    if (!paused) {
      lv.update(sim);
      this.dialogue.update(sim);
      if (this.scene) {
        this.scene.update(sim);
        if (this.scene.finished) {
          const era = this.scene;
          this.scene = null;
          // A cena da nota devolve o jogador algemado; as do Capitulo 2
          // devolvem ele de pe.
          if (era instanceof NoteScene) this.player.controllable = false;
        }
      }
      if (this.qte) this.updateQte(sim);
      if (this.grab) this.updateGrab(sim);
      if (this.emboscada > 0) {
        this.emboscada -= sim;
        if (this.emboscada <= 0) this.dispararEmboscada();
      }
      let prendendo = false;
      if (this.escondido) prendendo = this.updateEsconderijo(sim);
      const canControl = !this.dialogue.active && !this.transition && !this.scene
        && !this.qte && !this.grab && !this.chaseSetpieces.action && !this.chaseSequence.action
        && !this.finishers.action && !uiAberta && !this.escondido;
      if (lv.materialAt) this.player.stepMaterial = lv.materialAt(this.player.x);
      this.player.update(sim, lv, canControl);
      if (cap2) this.updateCh2(sim, lv, prendendo);
      if (this.flags.cap3) this.updateCh3(sim, lv);
      // Numa conversa a camera sobe. A caixa de dialogo ocupa o terco de
      // baixo da tela, e sem isso quem esta falando com voce fica escondido
      // atras da propria fala.
      this.cam.offsetY = this.dialogue.talk ? 40 : 0;
      this.cam.follow(this.player.x, 0, this.player.facing, sim, Math.abs(this.player.vx) > 4);
      this.checkBarks(lv);
      this.updateRandomSfx(lv, sim);
      this.rain.update(sim, this.cam.x);
      this.fog.update(sim, lv.t);
      this.fx.update(sim);
      if (lv.indoor) this.dust.update(sim, lv.t);
      // luz do beco vem de cima e da esquerda; no bar, da lampada
      this.player.det.rimColor = lv.indoor ? '#e8b46a' : '#7fa5d8';
      this.player.det.rimDX = lv.indoor ? -1 : 1;
    }

    this.pause.update(dt);

    // ---- desenho ----
    const cam = this.cam;
    gfx.begin('#05060a');
    lv.drawBack(gfx.s, cam);
    if (lv.drawProps) lv.drawProps(gfx.s, cam);
    if (cap2) this.drawBloodDecals(gfx.s, cam, lv.key);
    if (cap2) this.chaseSetpieces.draw(gfx.s, cam, this, lv);
    if (cap2) this.chaseSequence.draw(gfx.s, cam, this, lv);
    if (cap2) this.finishers.draw(gfx.s, cam, this, lv);
    if (cap2) this.drawCinematicShadows(gfx.s, cam, lv);
    // Gente e inimigos vao ANTES do jogador: num corredor estreito o
    // personagem do jogador nunca pode ficar escondido atras de nada.
    //
    // 🐛 Isto estava dentro do `if (cap2)`. As pessoas do Capitulo 3
    // existiam, tinham conversa e tinham caixa de interacao — e NAO ERAM
    // DESENHADAS. O jogador conversava com o ar.
    for (const id of Object.keys(this.npcs)) {
      const n = this.npcs[id];
      if (n.cfg.level === lv.key) n.draw(gfx.s, cam, lv.groundY);
    }
    if (cap2) {
      this.director.draw(gfx.s, cam);
      this.chase.draw(gfx.s, cam, lv.key);
      if (this.credorParado) this.drawCredorParado(gfx.s, cam);
    }
    this.player.draw(gfx.s, cam);
    if (this.scene) this.scene.draw(gfx.s, cam);
    this.fx.draw(gfx.s, cam.ix, cam.iy);
    if (lv.indoor) this.dust.draw(gfx.s);
    else this.fog.draw(gfx.s);
    if (lv.weather === 'rain') this.rain.draw(gfx.s);
    lv.drawFore(gfx.s, cam);
    if (cap2) this.chaseSequence.drawFore(gfx.s, cam, this, lv);

    gfx.beginLights(lv.ambient);
    lv.addLights(gfx, cam);
    // "Luz de heroi": um halo fraquissimo colado no personagem. Nao existe
    // no mundo, existe para o jogador nunca perder o proprio corpo de vista
    // num jogo que e quase todo escuro.
    gfx.addLight(this.player.x - cam.ix, this.player.y - cam.iy - 30, 86,
      lv.indoor ? '#a88458' : '#8f8d84', 0.26, 1.45);
    for (const L2 of this.player.lights(cam)) gfx.addLight(L2.x, L2.y, L2.r, L2.color, L2.i);
    // O isqueiro e a lanterna dele na camara fria — e ele so aguenta
    // alguns segundos aceso por vez.
    if (this.isqueiroT > 0) {
      const fx2 = this.player.x - cam.ix + this.player.facing * 8;
      const fy2 = this.player.y - cam.iy - 40;
      const tremor = 0.78 + Math.sin(lv.t * 21) * 0.1 + Math.random() * 0.12;
      const fim = clamp(this.isqueiroT, 0, 1);
      gfx.addLight(fx2, fy2, 64 * fim, PAL.flame, 0.95 * tremor * fim);
      gfx.addLight(fx2, fy2, 16, '#fff0c0', 0.9 * fim);
    }
    if (lv.casaco > 0) {
      gfx.addLight(lv.casacoX - cam.ix, lv.casacoY - cam.iy, 66,
        PAL.flame, 0.55 * lv.casaco * (this.isqueiroT > 0 ? 1 : 0.3));
    }
    if (this.scene) this.scene.addLights(cam);
    gfx.endLights(lv.bloom);

    // ---- interface ----
    if (this.locCard > 0) {
      const a = clamp(Math.min(this.locCard, 4.0 - this.locCard + 3.4), 0, 1);
      drawLocationCard(gfx.s, lv.nameKey, this.flagsFirst ? 'chapter_1' : null, a);
    }

    // O balao fica acima da CABECA do detetive, nao acima do objeto: quase
    // sempre ele esta colado no objeto, e em cima do objeto o balao tapava
    // justamente o personagem.
    const near = (!this.dialogue.active && !paused && !this.scene && !this.qte
      && !this.grab && !this.chaseSetpieces.action && !this.chaseSequence.action
      && !this.finishers.action && !uiAberta && !this.escondido)
      ? lv.nearest(this.player.x) : null;
    this.promptA = lerp(this.promptA || 0, near ? 1 : 0, 1 - Math.exp(-14 * dt));
    if (this.promptA > 0.02 && near) {
      drawPrompt(gfx.s, this.player.x - cam.ix, this.player.y - cam.iy - 70,
        near.prompt, this.promptA, lv.t);
    }

    // Fala curta como legenda de jogo. Nada flutua sobre o personagem e o
    // fundo acompanha apenas o tamanho da frase, sem cobrir o cenario.
    const fa = this.player.floatAlpha();
    if (fa > 0) {
      const ft = this.player.floatText;
      const fala = `${T('speaker_me')}: ${T(ft.key)}`;
      const estilo = { size: 9, font: 'ui', weight: 'normal' };
      const linhas = wrap(fala, VW - 48, estilo);
      const maxW = Math.max(...linhas.map(s => measure(s, estilo).w));
      const fy = VH - 31 - (linhas.length - 1) * 12;
      gfx.s.save();
      gfx.s.globalAlpha = fa * 0.62;
      gfx.s.fillStyle = '#050407';
      gfx.s.fillRect(Math.round(VW / 2 - maxW / 2 - 7), Math.round(fy - 4), maxW + 14, linhas.length * 12 + 6);
      gfx.s.restore();
      for (let i = 0; i < linhas.length; i++) {
        text(gfx.s, linhas[i], VW / 2, fy + i * 12, {
          ...estilo, color: '#f2ede4', align: 'center', alpha: fa,
          shadow: true, shadowColor: '#000000', shadowAlpha: 1,
        });
      }
    }

    if (this.scene) this.scene.drawUI(gfx.s);
    if (this.qte) this.drawQteUI(gfx.s);
    if (this.grab) this.drawGrabUI(gfx.s);
    if (cap2) this.chaseSetpieces.drawUI(gfx.s);
    if (cap2) this.chaseSequence.drawUI(gfx.s);
    if (cap2) this.finishers.drawUI(gfx.s);
    if (this.flags && this.flags.combat_lab) this.drawCombatLabUI(gfx.s);
    if (!paused && !this.scene && !this.qte && !uiAberta) this.drawGunUI(gfx.s, cam);
    if (cap2 && !this.scene) this.drawCh2UI(gfx.s);
    // O painel de senha e um LED: e desenhado DEPOIS da luz, senao a
    // multiplicacao apaga o digito. O numero muda, entao ele nao pode viver
    // na camada pintada da fase.
    if (this.flags.cap3 && lv.key === 'ch3_reception') {
      this.ticket.draw(gfx.s, cam, 744, 96);
    }

    // Poupa o personagem do grao e das scanlines (ver gfx._post).
    gfx.protect = {
      x: Math.round(this.player.x - cam.ix) - 26,
      y: Math.round(this.player.y - cam.iy) - 76,
      w: 52, h: 80,
    };

    this.dialogue.draw(gfx.s);
    if (cap2 || this.flags.cap3) {
      this.journal.draw(gfx.s); this.inv.draw(gfx.s); this.drawMapa(gfx.s);
    }
    if (cap2) this.shiftPuzzle.draw(gfx.s);
    if (this.flags.cap3) this.namePrompt.draw(gfx.s);
    this.pause.draw(gfx.s);
    if (this.debug) this.drawDebug(gfx.s, 'PLAY ' + lv.key);
    gfx.present(dt);
  }

  // Linha de mira e contador de balas.
  //
  // A linha existe porque nao ha mira na tela: sem ela o jogador nao tem
  // como saber para onde o cano esta apontando antes de gastar a bala.
  // Ela e pontilhada e fraca de proposito — e uma nocao, nao um laser.
  drawGunUI(ctx, cam) {
    const p = this.player;

    if (p.aiming) {
      const rad = p.aimAngle * Math.PI / 180;
      const ox = p.x - cam.ix + p.facing * 26;
      const oy = p.y - cam.iy - 48 - Math.sin(rad) * 10;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let d = 6; d < 130; d += 7) {
        const a = 0.42 * (1 - d / 130);
        ctx.globalAlpha = a;
        ctx.fillStyle = '#d8a860';
        ctx.fillRect(Math.round(ox + p.facing * d), Math.round(oy - Math.tan(rad) * d), 1, 1);
      }
      ctx.restore();
    }

    if (p.ammoHud > 0 || p.aiming) {
      const a = p.aiming ? 1 : clamp(p.ammoHud, 0, 1);
      const x = VW - 16, y = VH - 20;
      ctx.save();
      ctx.globalAlpha = a;
      for (let i = 0; i < p.clipSize; i++) {
        const bx = x - (p.clipSize - i) * 5;
        ctx.fillStyle = i < p.ammo ? '#e8c88a' : '#3a332c';
        ctx.fillRect(bx, y, 3, 6);
        if (i < p.ammo) { ctx.fillStyle = '#fff0c8'; ctx.fillRect(bx, y, 3, 1); }
      }
      text(ctx, String(p.reserve), x - p.clipSize * 5 - 6, y - 2, {
        size: 9, font: 'ui', weight: 'bold', color: PAL.uiDim, align: 'right', alpha: a,
      });
      if (p.gun === 'reloading') {
        text(ctx, 'R', x - p.clipSize * 5 - 6, y - 2, {
          size: 9, font: 'ui', weight: 'bold', color: PAL.uiAccent, align: 'right', alpha: a,
        });
      }
      ctx.restore();
    }
  }

  // Sons soltos do lugar: uma gota, uma chapa de metal cedendo, uma porta
  // longe. Espacados de forma irregular — som que chega em intervalo certo
  // deixa de ser ambiente e vira metronomo.
  updateRandomSfx(lv, dt) {
    if (!lv.randomSfx || !this.randomSfxT) return;
    for (let i = 0; i < lv.randomSfx.length; i++) {
      const r = lv.randomSfx[i];
      this.randomSfxT[i] -= dt;
      if (this.randomSfxT[i] <= 0) {
        this.randomSfxT[i] = r.min + Math.random() * (r.max - r.min);
        const fn = audio[r.fn];
        if (fn) fn.call(audio, r.vol === undefined ? 1 : r.vol);
      }
    }
  }

  // Falas de passagem: dispara quando o jogador cruza um ponto da fase.
  // Cada uma so uma vez por visita — repetir piada mata a piada.
  checkBarks(lv) {
    if (!lv.barks) return;
    for (let i = 0; i < lv.barks.length; i++) {
      const b = lv.barks[i];
      if (b.done) continue;
      if (Math.abs(this.player.x - b.x) < (b.range || 40)) {
        b.done = true;
        this.flags.barks = this.flags.barks || {};
        this.flags.barks[`${lv.key}:${i}`] = true;
        this.player.sayAll(Array.isArray(b.key) ? b.key : [b.key]);
      }
    }
  }

  doInteract(it) {
    if (it.action === 'enter_bar') {
      audio.doorCreak(0.9);
      this.fadeTo(() => {
        this.enterLevel('bar', null, 1);
        audio.doorSlam(0.5);
      }, 0.7, 0.9);
      return;
    }
    if (it.action === 'exit_bar') {
      audio.doorCreak(0.9);
      this.fadeTo(() => {
        this.enterLevel('alley', this.levels.alley.doorX - 26, -1);
      }, 0.7, 0.9);
      return;
    }
    if (it.action === 'enter_back') {
      audio.doorCreak(0.8);
      this.fadeTo(() => this.enterLevel('backroom', null, 1), 0.7, 0.9);
      return;
    }
    if (it.action === 'exit_back') {
      audio.doorCreak(0.8);
      this.fadeTo(() => this.enterLevel('bar', 900, -1), 0.7, 0.9);
      return;
    }
    if (it.action === 'read_note') {
      this.startNoteScene();
      return;
    }
    if (it.action === 'take_pipe') {
      this.flags.pipe = true;
      it.disabled = true;
      audio.reloadClick(0.6);
      this.player.say('bark_pipe_take', 2.0, true);
      return;
    }
    if (it.action === 'pry_door') {
      if (!this.flags.pipe) {
        this.player.say('bark_door_pry', 2.6, true);
        audio.doorSlam(0.35);
        gfx.shake(1.6, 0.2);
        return;
      }
      // com o cano na mao: arranca as tabuas
      audio.strain(1);
      gfx.shake(3, 0.4);
      this.fx.burst(18, () => ({
        x: this.player.x + this.player.facing * 20 + Math.random() * 10,
        y: this.level.groundY - 40 - Math.random() * 40,
        vx: this.player.facing * (30 + Math.random() * 80), vy: -40 + Math.random() * 80,
        ay: 260, life: 0.6, size: 1, color: '#43301e', a: 1, fade: 1,
      }));
      setTimeout(() => audio.doorCreak(1), 260);
      // Ele sai. E o galpao e muito maior do que ele pensava.
      this.fadeTo(() => this.startChapter2(), 1.4, 0.01);
      return;
    }
    if (it.action === 'goto') {
      // Porta que pede chave. E o que impede o jogador de topar com o
      // Credor antes de ter com que se defender.
      if (it.precisa && !this.flags[it.precisa]) {
        audio.doorSlam(0.4);
        gfx.shake(1.4, 0.18);
        this.player.say(it.semChave || 'b2_trancado', 0, true);
        return;
      }
      audio.doorCreak(it.sfx === 'heavy' ? 0.5 : 0.9);
      if (it.sfx === 'heavy') audio.metalCreak(1);
      const urgente = this.chase.ativo;
      this.fadeTo(() => {
        this.enterLevel(it.to, it.tox, it.tofacing);
        if (it.isDoor) audio.doorSlam(0.45);
      }, urgente ? 0.12 : 0.28, urgente ? 0.24 : 0.42);
      return;
    }
    if (this.doInteractCh2(it)) return;
    if (it.lines) {
      this.flags.examinado = this.flags.examinado || {};
      const vistoKey = `${this.level.key}:${it.id || it.lines}:${Math.round(it.x || 0)}`;
      if (this.flags.examinado[vistoKey]) return;
      this.flags.examinado[vistoKey] = true;
      const arr = LINES[it.lines] || [];
      this.dialogue.start(arr.map((_, i) => ({ name: null, text: L(it.lines, i) })));
    }
  }

  // -------------------------------------------------------------------
  // a cena da nota
  // -------------------------------------------------------------------

  startNoteScene() {
    this.scene = new NoteScene(this.player, this.fx);
    this.scene.onWake = () => {
      this.enterLevel('warehouse', null, 1);
      this.player.frozen = true;
      this.player.controllable = false;
      this.player.det.play('cuffed', { blend: 0 });
      // levaram tudo: nem arma, nem coldre cheio
      this.player.hasGun = false;
      this.player.gun = 'holstered';
      this.player.ammo = 0; this.player.reserve = 0;
      this.player.det.props.gun = 'none';
      this.locCard = 0;
    };
    // So depois das palpebras abrirem: antes disso as falas ficavam
    // escondidas atras do preto e ninguem lia nenhuma.
    this.scene.onAwake = () => {
      this.locCard = 4.5;
      this.player.sayAll(['bark_cell_1', 'bark_cell_2', 'bark_cell_3'], true);
      this.qte = { prog: 0, last: null, t: 0, hint: 0 };
    };
    this.scene.start(this.level);
  }

  // -------------------------------------------------------------------
  // o QTE de se soltar do cano
  // -------------------------------------------------------------------

  updateQte(dt) {
    const q = this.qte, p = this.player;
    q.t += dt;
    q.hint = Math.min(1, q.hint + dt * 1.4);

    // A alternancia e o que importa: martelar a mesma tecla nao adianta.
    const a = input.pressedFrame.has('KeyA') || input.pressedFrame.has('ArrowLeft');
    const d = input.pressedFrame.has('KeyD') || input.pressedFrame.has('ArrowRight');
    let puxou = false;
    if (a && q.last !== 'A') { q.last = 'A'; puxou = true; }
    else if (d && q.last !== 'D') { q.last = 'D'; puxou = true; }

    if (puxou) {
      // Numeros calibrados para MAO HUMANA. Antes eram 0.058 por toque
      // contra 0.20/s de queda: alternando a 4 toques por segundo o saldo
      // era +0.03/s, ou seja meio minuto de martelada. Agora 4 toques por
      // segundo enchem a barra em cerca de tres segundos.
      q.prog = clamp(q.prog + 0.085, 0, 1);
      q.pull = 0.16;
      audio.strain(0.7 + q.prog * 0.5);
      if (Math.random() < 0.4) audio.chainRattle(0.5);
      gfx.shake(0.6 + q.prog * 1.6, 0.12);
    }
    // Trava de catraca: o progresso nunca cai abaixo do quarto ja
    // conquistado. Sem isso, quem martela devagar fica preso para sempre e
    // o jogo vira um teste de dedo, nao de tensao.
    q.floor = Math.max(q.floor || 0, Math.floor(q.prog * 4) / 4);
    q.prog = Math.max(q.floor, q.prog - dt * 0.09);
    if (q.pull > 0) q.pull -= dt;

    const puxando = q.pull > 0;
    if (puxando && p.det.anim !== 'strainCuffs') p.det.play('strainCuffs', { blend: 0.08 });
    else if (!puxando && q.prog < 0.02 && p.det.anim !== 'cuffed') p.det.play('cuffed', { blend: 0.3 });
    p.det.speed = 1 + q.prog;
    p.det.update(dt);

    if (q.prog >= 1) this.breakFree();
  }

  breakFree() {
    const p = this.player, lv = this.level;
    this.qte = null;
    audio.pipeBurst(1);
    gfx.shake(4.5, 0.6);
    // ferrugem e agua saindo do cano arrebentado
    this.fx.burst(30, () => ({
      x: p.x + 8 + Math.random() * 26, y: lv.pipeY + 2,
      vx: 40 + Math.random() * 90, vy: -20 + Math.random() * 60, ay: 260,
      life: 0.5 + Math.random() * 0.7, size: 1,
      color: Math.random() > 0.5 ? '#6b8ba8' : '#6e4728', a: 0.9, fade: 1.1,
    }));

    p.frozen = false;
    p.controllable = true;
    p.det.play('idle', { blend: 0.4 });
    // De pe, mas sem nada. So a partir daqui o ocio dele vira sentar — e
    // ainda assim so depois de um tempo em pe, como quem cansa de esperar.
    p.idleMode = 'sit';
    lv.minX = lv.freeMinX;
    lv.maxX = lv.freeMaxX;
    lv.interactables = lv.interLivre;
    for (const b of (lv.barks || [])) b.done = false;
    p.sayAll(['bark_free_1', 'bark_free_2', 'bark_free_3'], true);
  }

  drawQteUI(ctx) {
    const q = this.qte;
    if (!q) return;
    const a = q.hint;
    const w = 108, h = 6;
    const x = (VW - w) / 2, y = VH - 52;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#0c0a0b';
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#2a2320';
    ctx.fillRect(x, y, w, h);
    const g2 = ctx.createLinearGradient(x, 0, x + w, 0);
    g2.addColorStop(0, '#7a2a22');
    g2.addColorStop(1, '#c8503a');
    ctx.fillStyle = g2;
    ctx.fillRect(x, y, Math.round(w * q.prog), h);
    ctx.restore();
    const pisca = q.last === 'A' ? 0 : 1;
    text(ctx, T('qte_hint'), VW / 2, y - 14, {
      size: 9, font: 'ui', weight: 'bold', color: pisca ? '#e8e0d2' : PAL.uiAccent,
      align: 'center', track: 3, alpha: a, shadow: true,
    });
  }

  // Fim do trecho jogavel. Cartao preto, e volta para o menu.
  endOfChapter() {
    this.state = 'endcard';
    this.endT = 0;
    this.qte = null;
    this.scene = null;
    audio.stopAllLoops();
    audio.stopDread(0.2);
  }

  updateEndCard(dt) {
    this.endT += dt;
    gfx.begin('#000');
    const a = clamp(this.endT - 0.4, 0, 1) * clamp(4.6 - this.endT, 0, 1);
    text(gfx.s, T('to_be_continued'), VW / 2, VH / 2 - 6, {
      size: 13, font: 'serif', color: PAL.uiText, align: 'center', track: 4, alpha: a,
    });
    gfx.fade = 0;
    gfx.present(dt);
    if (this.endT > 5.2) this.toMenu();
  }

  // ===================================================================
  // CAPITULO 2 — "GENTILEZA"
  // ===================================================================

  resetChapter2() {
    this.sanity.enabled = false;
    this.sanity.reset(100);
    this.journal.reset();
    this.inv.reset();
    this.shiftPuzzle.reset();
    this.director.reset();
    this.director.ligado = false;
    this.chase.parar();
    this.chaseSetpieces.reset();
    this.chaseSequence.reset(this);
    this.finishers.reset();
    this.grab = null;
    this.cigTentativas = 0;
    this.escondido = null;
    this.isqueiroT = 0;
    this.credorParado = null;
    this.fugaPendente = null;
    this.bloodDecals = [];
    if (this.player && this.player.det) this.player.det.blood = 0;
    if (this.player && this.player.det) { this.player.det.coatTorn = false; this.player.det.injury = 0; }
    for (const id of Object.keys(this.npcs)) {
      this.npcs[id].falado = false;
      this.npcs[id].reviver();
    }
  }

  // Preto, "CAPITULO DOIS", e embaixo o nome. Mesma tipografia corroida do
  // titulo do jogo.
  startChapter2() {
    this.state = 'chapcard';
    this.chapT = 0;
    this.chapNum = 2;
    this.qte = null;
    this.scene = null;
    audio.stopAllLoops();
    audio.stopDread(0.2);
    this.flags.cap2 = true;
    if (!this.flags.supplies) this.flags.supplies = this.supplies.newRun();
